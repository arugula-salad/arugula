# cargo-nextest for the server's workspace (server/Cargo.toml): the root's
# .config/nextest.toml without its overrides, which name the daemon's tests
# (nextest refuses a filter that matches no package here).

[profile.default]
# A hung test fails after 5 minutes instead of holding the run.
slow-timeout = { period = "60s", terminate-after = 5 }

# CI (NEXTEST_PROFILE=ci): a test that fails and then passes is reported as
# flaky, not failed (the root's says why).
[profile.ci]
retries = 1
failure-output = "immediate-final"
fail-fast = false

# A JUnit file per run, target/nextest/ci/junit-server.xml (the two workspaces
# share a target dir, so each has its own name): quarantine-nightly.yml's
# `chant ci quarantine report` reads it. The quarantined tests are left out
# by the -E filterset CI passes (docs/testing.md, "Quarantine").
[profile.ci.junit]
path = "junit-server.xml"
