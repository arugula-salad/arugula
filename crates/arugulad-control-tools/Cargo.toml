[package]
name = "arugulad-control-tools"
description = "The daemon's MCP tools for what lives in Arugula control: Cloud workspaces, linked repos, conversations, native issues, boards, runs, deploys and agent sessions"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true, features = ["schema"] }
arugulad-base = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
# MCP (M16), pinned as the base pins it.
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars"] }
schemars = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }

[lints]
workspace = true
