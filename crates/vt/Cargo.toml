[package]
name = "arugula-vt"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "8953a74" }
regex = { workspace = true }
zstd = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
