[package]
name = "arugula-control-wire"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arugula-e2e = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }

[features]
# TypeScript for the chat types control's page uses (M122): arugula-proto's
# `ts` feature turns it on and puts them in web/src/proto.gen.ts.
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_urlencoded = { workspace = true }

[lints]
workspace = true
