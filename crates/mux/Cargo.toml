[package]
name = "arugula-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arugula-core = { workspace = true }
arugula-proto = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

# ptys, signals, sockets: Unix only. Windows gets ConPTY (M56).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "process", "fs", "ioctl", "signal", "poll", "socket", "uio", "hostname", "user", "dir"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }

[lints]
workspace = true
