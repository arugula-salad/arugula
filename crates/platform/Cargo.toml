[package]
name = "arugula-platform"
# The workspace's version, as the `arugula-platform` binary's (M140).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arugula control's platform: chat, Cloud and billing, behind the hub"

[[bin]]
name = "arugula-platform"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arugula-cloud-wire = { workspace = true }
arugula-control-common = { workspace = true }
# Chat's wire types (M138), which daemons and the page share.
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
axum = { workspace = true }
# Postgres parameters as tokio-postgres writes them (M143).
bytes = "1.12.1"
# Cloud secrets, sealed with ARUGULA_CLOUD_SECRET_KEY.
chacha20poly1305 = "0.10.1"
# Cloud's flags and their env vars, which control takes too.
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
# Waiting for a Postgres answer from synchronous code (`db/pg.rs`).
futures-executor = "0.3.34"
hex = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# The platform on Postgres (M143): plain Postgres, no extensions, over the
# private network (no TLS). Not sqlx: its SQLite driver can't share a build
# with rusqlite, and this needs only the Postgres half.
tokio-postgres = "0.7.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[features]
# The contract tests every `HubPort` keeps (`contract`): control runs them
# against its in-process port, and M140 against the HTTP one.
contract = []

[lints]
workspace = true
