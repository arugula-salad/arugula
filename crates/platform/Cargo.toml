[package]
# The platform's base (#314): what every platform feature crate
# (`arugula-platform-<area>`) sits on. The `arugula-platform` binary is
# crates/arugula-platform. The library keeps its name, `arugula_platform`,
# so its paths and log targets are what they were before the split.
name = "arugula-platform-base"
# The hosted server's own workspace (server/Cargo.toml), not the root's.
workspace = "../../server"
# The workspace's version: the platform reports it (`/platform.json`).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arugula control's platform: chat, hosted workspaces and billing, behind the hub"

[lib]
name = "arugula_platform"

[dependencies]
anyhow = { workspace = true }
arugula-control-common = { workspace = true }
# The hub's side of the seam (#314): the ports, the page, who's asking.
arugula-platform-api = { workspace = true }
# Chat's wire types (M138), which daemons and the page share.
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
# The forge mirror's reads and GitHub's payloads onto rows (M164).
arugula-forge-github = { workspace = true }
# The GitHub App's JWT (RS256), the platform's since M161.
aws-lc-rs = "1.18.1"
axum = { workspace = true }
base64 = { workspace = true }
# Postgres parameters as tokio-postgres writes them (M143).
bytes = "1.12.1"
# Secrets, sealed with project keys that ARUGULA_CLOUD_SECRET_KEY wraps.
chacha20poly1305 = "0.10.1"
# The platform's flags and their env vars, some of which control takes too.
clap = { workspace = true, features = ["derive", "env"] }
# Run schedules' cron expressions (M214), read in their time zones.
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
futures-util = { workspace = true }
# Waiting for a Postgres answer from synchronous code (`db/pg.rs`).
futures-executor = "0.3.34"
hex = { workspace = true }
hmac = { workspace = true }
# Time zones for run schedules (M214), with IANA's database built in: the
# platform's image has no /usr/share/zoneinfo.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# The platform on Postgres (M143): plain Postgres, no extensions, over the
# private network (no TLS). Not sqlx: its SQLite driver can't share a build
# with rusqlite, and this needs only the Postgres half.
tokio-postgres = "0.7.18"
tracing = { workspace = true }
url = { workspace = true }
# The test harness's passkeys (`testing`): the test hub checks an Ed25519
# assertion as the hub does.
ed25519-dalek = { workspace = true, optional = true }

[features]
# Embed web/dist-platform even in a debug build (rust-embed reads it from
# the source tree at run time otherwise), as control's `debug-embed` does
# web/dist; control's turns this on too.
debug-embed = ["arugula-platform-api/debug-embed"]
# The contract tests every `HubPort` keeps (`contract`): control runs them
# against its in-process port, and M140 against the HTTP one.
contract = []
# The test harness, for the feature crates' tests (#314): a hub of the
# test's own (`chat_tests::TestHub`), the fake GitHub, deploys' signed
# approvals. Only ever a dev-dependency's feature.
testing = ["contract", "dep:ed25519-dalek"]

[lints]
workspace = true

[dev-dependencies]
# Tests that read what a call logged.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Test passkeys (M218): the test hub checks an Ed25519 assertion as the hub does.
ed25519-dalek = { workspace = true }
