[package]
# The load test of control (#530): fake daemons and browser pages against a
# staging control, through the real routes. Not shipped: nothing depends on
# it, and no release builds it.
name = "arugula-control-load"
# The hosted server's own workspace (server/Cargo.toml), not the root's.
workspace = "../../server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A load generator for Arugula control: enrols fake daemons and browser pages and measures the relay"
publish = false

[[bin]]
name = "arugula-control-load"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
base64 = { workspace = true }
ciborium = "0.2.2"
ed25519-dalek = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
url = { workspace = true }

[lints]
workspace = true
