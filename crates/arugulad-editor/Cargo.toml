[package]
name = "arugulad-editor"
description = "The daemon's editor server and Claude Code's IDE (arugulad's editor feature)"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
arugula-core = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true }
arugulad-base = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
hex = { workspace = true }
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
