path = "/api/agent-tokens"  # wire::agent_mcp::AGENT_TOKENS
process = "platform"
auth = "session"
clients = ["page"]
note = "Mints one, from a browser's session on the platform page only (a CLI's login is refused): a name, projects the minter reads (asked of the hub), powers. The token is in this answer only; the account's devices are pushed a notice."

[[route]]
