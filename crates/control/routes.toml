# ---- platform: grants
# The platform's since step 2 (#1150), with projects: a machine gets
# `cloud.drive` when the hub's change feed says it joined, or the first time
# it asks, and the list names machines from the hub's directory
# (`HubPort::daemons`).

[[route]]
method = "GET"
path = "/api/grants"
process = "platform"
auth = "session"
clients = ["cli"]

[[route]]
method = "POST"
path = "/api/grants"
process = "platform"
auth = "session"
clients = ["cli"]

[[route]]
method = "POST"
path = "/api/grants/{id}/revoke"
process = "platform"
auth = "session"
clients = ["cli"]

# ---- platform: projects
# The platform page's list of the reader's projects (M150): their own and
# each team's default one, with the team's members read only.

[[route]]
method = "GET"
path = "/api/projects"  # wire::projects::PROJECTS
process = "platform"
auth = "session"
clients = ["page"]

