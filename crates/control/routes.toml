process = "platform"
auth = "session"
clients = ["page", "cli"]
note = "A deploy with its operation's bytes and hash, approvals and log, for its project's members."

[[route]]
method = "POST"
path = "/api/deploys/{id}/request"
process = "platform"
auth = "session"
clients = ["page", "cli"]
note = "Asks for its approval: owners and editors. Pushes each owner a card."

[[route]]
method = "POST"
path = "/api/deploys/{id}/approve"
process = "platform"
auth = "session"
clients = ["page"]
note = "Approves it once: an owner, from a browser's session only (a CLI's login is refused), with a signature by one of their browser devices (browsers back to the account's root) over the operation, checked against the devices the hub keeps, and a passkey's assertion over the approval's bytes, which the hub checks. The stale rule is checked in the same transaction."

[[route]]
method = "POST"
path = "/api/deploys/{id}/deny"
process = "platform"
auth = "session"
clients = ["page"]
note = "Denies it, signed and confirmed with a passkey as an approval is."

# A machine's agents: plan, ask and read, never approve. The owner's role is
# the ceiling, and the machine needs its owner's `deploys.plan` grant over the
# project (off until given), asked on every call. Asks are limited per project.

[[route]]
method = "POST"
path = "/api/daemon/projects/{project}/deploys"
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "Plans a deploy as the owner's agent: `deploys.plan`, and the owner an owner or editor."

[[route]]
method = "GET"
path = "/api/daemon/deploys/{id}"
process = "platform"
auth = "daemon"
clients = ["daemon"]

[[route]]
method = "POST"
path = "/api/daemon/deploys/{id}/request"
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "Asks the project's owners to approve it, and pushes them a card. All an agent does past planning."

# ---- platform: runs for a machine's agents (M216)
# MCP's start_run, read_run and wait on a run, signed by the machine. The
# machine needs its owner's grant over the project, asked on every call:
# `runs.read` to read, `runs.start` to start a run spec, `runs.command` to
# start a command or an instruction of its own. A start is its owner's by
# hand (an owner or editor on ARUGULA_HOSTED_ACCOUNTS), recorded with the
# machine, under the project's standing grant. Never an approval.

[[route]]
method = "GET"
path = "/api/daemon/runs/reach"  # wire::runs::AGENT_RUN_REACH
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "The projects the machine's run grants reach, as its owner reads them now: for capabilities."

[[route]]
method = "GET"
path = "/api/daemon/projects/{project}/runs"  # wire::runs::AGENT_PROJECT_RUNS
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "A project's runs: `runs.read`."

[[route]]
method = "POST"
path = "/api/daemon/projects/{project}/runs"  # wire::runs::AGENT_PROJECT_RUNS
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "Starts a run as the owner's, labelled with the machine (started_by_agent): a run spec with `runs.start`, a command or an instruction of its own with `runs.command`, and the owner an owner or editor on ARUGULA_HOSTED_ACCOUNTS. 60 an hour."

[[route]]
method = "GET"
path = "/api/daemon/runs/{run}"  # wire::runs::AGENT_RUN
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "A run with its timeline: `runs.read`. With since and wait, answers once it moves or ends (at most 15 s), which MCP's wait asks again until it ends: at most 8 open per account and per machine, 2000 an hour apart from other reads."

[[route]]
method = "GET"
path = "/api/daemon/runs/{run}/log"  # wire::runs::AGENT_RUN_LOG
process = "platform"
auth = "daemon"
clients = ["daemon"]
note = "A page of a run's durable log: `runs.read`."

