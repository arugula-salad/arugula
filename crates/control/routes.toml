process = "platform"
auth = "agent_token"
clients = ["agent"]
note = "MCP (Streamable HTTP, one JSON-RPC message per POST, at most 64 KiB, stateless; no batches) for agents with no machine. The only platform route a client's Authorization reaches besides the inference broker's (gateway::bearer_route): issues, threads, runs, deploy plans and asks, project secrets set by name. Never an approval. Every call is noted for the token's owner."

