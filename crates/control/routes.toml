# Every route control registers (`routes()` in src/main.rs), and which
# process answers it once control is split into a hub and a platform
# (platform step 2, #1150). A test (`routes::` in src/routes.rs) fails when
# the router has a route that isn't here, or this lists one it doesn't, or
# lists one twice.
#
# Each route, one per method and path:
# - `method`: `GET`, `POST`, `PUT`, `PATCH`, `DELETE`, or `ANY` (every
#   method, one handler). A `GET` also answers `HEAD`.
# - `path`: as registered, with axum's `{param}` and `{*rest}`. A path from
#   arugula-control-wire is written out, with its constant in a comment.
# - `process`: `hub` (identity, devices, rosters, the relay, push, block and
#   doc origins, forge and telemetry: it deploys rarely) or `platform` (chat,
#   Cloud, billing, projects and grants: it deploys as often as it likes). Every path stays on control's own site whichever answers it:
#   the hub is the gateway for the platform's.
# - `auth`: what control checks before it acts:
#   - `public`: nothing (some are rate-limited; `note` says what stands in);
#   - `session`: a signed-in person, by their cookie, or a CLI device by its
#     signature (`auth::Session`);
#   - `daemon`: an enrolled daemon's signature (`auth::DaemonAuth`);
#   - `daemon_optional`: a daemon's signature when there is one, and nothing
#     otherwise;
#   - `session_or_daemon`: either (`auth::Reacher`, `doc_links::Caller`);
#   - `cloud_driver`: a session, or a daemon whose account gave it a live
#     `cloud.drive` grant (the platform's `cloud::CloudDriver`);
#   - `sign_in`: a sign-in under way (GitHub's OAuth state, a passkey's
#     challenge);
#   - `join_proof`: a machine's key proving it holds the key it asks to join
#     with, before it has an account;
#   - `poll_token`: the token a join handed out;
#   - `app_ticket`: the desktop app's sign-in ticket, its grant and verifier;
#   - `webhook`: the provider's signature on the body.
# - `clients`: who calls it: `page` (control's web page, in a browser or the
#   desktop app's webview), `daemon` (arugulad), `cli` (the arugula CLI),
#   `app` (the desktop app's own code), `browser` (a browser following a
#   link or a redirect, with no page of control's), `github` and `stripe`
#   (their webhooks), `operator` (by hand).
# - `note`: anything the rest doesn't say.
#
# Not routes, so not here: what a block's origin or the docs origin is
# answered with (`blocks::split`, before any route: the hub's, as block and
# doc origins are), the platform page on its own host (`platform_host::split`,
# M151, which lets only this list's platform routes through there), and
# control's page itself (the fallback, `asset`).

# ---- hub: what control is, and signing in

[[route]]
method = "GET"
path = "/control.json"  # wire::CONTROL_JSON
process = "hub"
auth = "public"
clients = ["page", "daemon", "cli", "app"]

[[route]]
method = "GET"
path = "/auth/github"
process = "hub"
auth = "sign_in"
clients = ["page", "app"]

[[route]]
method = "GET"
path = "/auth/github/callback"
process = "hub"
auth = "sign_in"
clients = ["browser"]
note = "GitHub sends the browser back here: the URL is set on the GitHub OAuth app, so the path never changes."

[[route]]
method = "POST"
path = "/auth/logout"
process = "hub"
auth = "session"
clients = ["page"]

# The platform page's sign-in (M152, "The hub signs people in to the
# platform page"): a one-time code for the platform page's host from the
# hub's own session (or control's page to sign in first), then the swap
# for that host's session, and signing out there. The swap and the sign-out
# answer only on the platform page's host (`platform_host::split`).

[[route]]
method = "GET"
path = "/signin/platform"
process = "hub"
auth = "session"
clients = ["browser"]
note = "Without a session it sends the browser to control's page to sign in, and back here."

[[route]]
method = "POST"
path = "/api/app/session"  # app_signin::APP_SESSION
process = "hub"
auth = "sign_in"
clients = ["page"]
note = "The platform page's: a code from /signin/platform, single use and a minute old at most, its PKCE verifier and the address it came back to."

[[route]]
method = "POST"
path = "/api/app/signout"  # app_signin::APP_SIGNOUT
process = "hub"
auth = "session"
clients = ["page"]
note = "The platform page's own session, on its host."

[[route]]
method = "POST"
path = "/auth/app"
process = "hub"
auth = "public"
clients = ["app"]
note = "The desktop app asks for a ticket (M48); rate-limited."

[[route]]
method = "POST"
path = "/auth/app/{id}/redeem"
process = "hub"
auth = "app_ticket"
clients = ["page"]
note = "Control's page in the app's webview, with the ticket's grant and verifier."

[[route]]
method = "GET"
path = "/api/app-login/{id}"
process = "hub"
auth = "session"
clients = ["page"]

[[route]]
method = "POST"
path = "/api/app-login/{id}/allow"
process = "hub"
auth = "session"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/register"
process = "hub"
auth = "sign_in"
clients = ["page"]
note = "A new account's first passkey, or one more for the session's account."

[[route]]
method = "POST"
path = "/auth/passkey/register/finish"
process = "hub"
auth = "sign_in"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/login"
process = "hub"
auth = "sign_in"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/login/finish"
process = "hub"
auth = "sign_in"
clients = ["page"]

