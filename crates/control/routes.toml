path = "/api/agent-tokens/{id}/revoke"  # wire::agent_mcp::AGENT_TOKEN_REVOKE
process = "platform"
auth = "session"
clients = ["page", "cli"]
note = "Revokes a token of the account's and its grants: its agent's next call is refused."

[[route]]
