# ---- platform: agents with no machine (M230, platform step 8)
# An owner mints a bearer agent grant token over projects they read, with an
# agent's powers (and `secrets.write`), never `cloud.drive` and never an
# approval; it's shown once and kept as a hash. Its agent calls the MCP
# endpoint with it, and that's the only route that reads it: as the owner's
# agent, labelled with the token's name, through the same checks as a
# machine's agents.

[[route]]
method = "GET"
path = "/api/agent-tokens"  # wire::agent_mcp::AGENT_TOKENS
process = "platform"
auth = "session"
clients = ["page", "cli"]
