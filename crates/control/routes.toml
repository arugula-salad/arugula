# Every route control registers (`routes()` in src/main.rs), and which
# process answers it once control is split into a hub and a platform
# (platform step 2, #1150). A test (`routes::` in src/routes.rs) fails when
# the router has a route that isn't here, or this lists one it doesn't, or
# lists one twice.
#
# Each route, one per method and path:
# - `method`: `GET`, `POST`, `PUT`, `PATCH`, `DELETE`, or `ANY` (every
#   method, one handler). A `GET` also answers `HEAD`.
# - `path`: as registered, with axum's `{param}` and `{*rest}`. A path from
#   arugula-control-wire is written out, with its constant in a comment.
# - `process`: `hub` (identity, devices, rosters, the relay, push, block and
#   doc origins, forge and telemetry: it deploys rarely) or `platform` (chat,
#   Cloud, billing, projects and grants: it deploys as often as it likes). Every path stays on control's own site whichever answers it:
#   the hub is the gateway for the platform's.
# - `auth`: what control checks before it acts:
#   - `public`: nothing (some are rate-limited; `note` says what stands in);
#   - `session`: a signed-in person, by their cookie, or a CLI device by its
#     signature (`auth::Session`) where `clients` lists `cli`; what only the
#     page does takes the cookie alone (`auth::PageSession`);
#   - `daemon`: an enrolled daemon's signature (`auth::DaemonAuth`);
#   - `daemon_optional`: a daemon's signature when there is one, and nothing
#     otherwise;
#   - `session_or_daemon`: either (`auth::Reacher`, `doc_links::Caller`);
#   - `cloud_driver`: a session, or a daemon whose account gave it a live
#     `cloud.drive` grant (the platform's `cloud::CloudDriver`);
#   - `sign_in`: a sign-in under way (GitHub's OAuth state, a passkey's
#     challenge);
#   - `join_proof`: a machine's key proving it holds the key it asks to join
#     with, before it has an account;
#   - `poll_token`: the token a join handed out;
#   - `app_ticket`: the desktop app's sign-in ticket, its grant and verifier;
#   - `webhook`: the provider's signature on the body.
#   - `issuer_code`: the issuer's one-time code with its client, redirect
#     address and PKCE verifier (M228);
#   - `issuer_token`: an access token the issuer handed out, as a bearer
#     (M228).
#   - `client_secret`: a registered issuer client's id and secret, as
#     HTTP Basic (M229: an `oidc` client's link secret; M237: a `hud`
#     box's).
#   - `hosted_enrollment`: a hosted box's one-time ticket or sandbox id,
#     and its key proving it holds the key it enrolls (M178);
#   - `hosted`: a live hosted machine's signature (`auth::HostedAuth`),
#     which no other route takes;
#   - `daemon_or_hosted`: either a daemon's or a hosted machine's
#     (`auth::Dialer`);
#   - `agent_token`: a live agent grant token (M230), `Authorization:
#     Bearer aru_agent_…`, which the platform finds by its hash and no
#     other route reads;
#   - `session_or_client`: a session (or a CLI device), or a registered
#     client's credential, which the platform checks itself
#     (`hosted::broker::clients`, M231);
#   - `push_listen`: a live push subscription's listen token, as a bearer,
#     which only its subscribe answered (`push_live.rs`);
#   - `client`: a registered client's credential only (M236,
#     `Authorization: Bearer`, checked by the platform as M231's are), on
#     the client's own `/api/client/...` routes.
# - `clients`: who calls it: `page` (control's web page, in a browser or the
#   desktop app's webview), `daemon` (arugulad), `cli` (the arugula CLI),
#   `app` (the desktop app's own code), `browser` (a browser following a
#   link or a redirect, with no page of control's), `github` and `stripe`
#   (their webhooks), `operator` (by hand), `product` (another product
#   that takes the hub's tokens: studio, a hud box, M228's clients), `agent`
#   (an agent with no machine, with an agent grant token, M230), `apple`
#   (Apple's associated-domains CDN, for the macOS app, D2). Enforced for the CLI: a CLI
#   device's signature is refused (401, `page_only`) on every route that
#   doesn't list `cli` (`clients::gate`).
# - `note`: anything the rest doesn't say.
#
# Not routes, so not here: what a block's origin or the docs origin is
# answered with (`blocks::split`, before any route: the hub's, as block and
# doc origins are), the platform page on its own host (`platform_host::split`,
# M151, which lets only this list's platform routes through there), and
# control's page itself (the fallback, `asset`).

# ---- hub: what control is, and signing in

[[route]]
method = "GET"
path = "/control.json"  # wire::CONTROL_JSON
process = "hub"
auth = "public"
clients = ["page", "daemon", "cli", "app"]

[[route]]
method = "GET"
path = "/auth/github"
process = "hub"
auth = "sign_in"
clients = ["page", "app"]

[[route]]
method = "GET"
path = "/auth/github/callback"
process = "hub"
auth = "sign_in"
clients = ["browser"]
note = "GitHub sends the browser back here: the URL is set on the GitHub OAuth app, so the path never changes. A state `send.<nonce>` is a person's send (M168): its user token goes to the platform for one call, then is revoked."

[[route]]
method = "POST"
path = "/auth/logout"
process = "hub"
auth = "session"
clients = ["page"]

# The platform page's sign-in (M152, "The hub signs people in to the
# platform page"): a one-time code for the platform page's host from the
# hub's own session (or control's page to sign in first), then the swap
# for that host's session, and signing out there. The swap and the sign-out
# answer only on the platform page's host (`platform_host::split`).

[[route]]
method = "GET"
path = "/signin/platform"
process = "hub"
auth = "session"
clients = ["browser"]
note = "Without a session it sends the browser to control's page to sign in, and back here."

[[route]]
method = "POST"
path = "/api/app/session"  # app_signin::APP_SESSION
process = "hub"
auth = "sign_in"
clients = ["page"]
note = "The platform page's: a code from /signin/platform, single use and a minute old at most, its PKCE verifier and the address it came back to."

[[route]]
method = "POST"
path = "/api/app/signout"  # app_signin::APP_SIGNOUT
process = "hub"
auth = "session"
clients = ["page"]
note = "The platform page's own session, on its host."

# The hub as an issuer (M228, issuer.rs): 404 when it has no key.

[[route]]
method = "GET"
path = "/.well-known/openid-configuration"
process = "hub"
auth = "public"
clients = ["product"]

[[route]]
method = "GET"
path = "/.well-known/jwks.json"
process = "hub"
auth = "public"
clients = ["product"]
note = "Every key published: the one that signs, the next before it signs, the previous until its tokens run out."

# The macOS app's passkeys (D2, apple_site.rs): 404 without a Team ID.

[[route]]
method = "GET"
path = "/.well-known/apple-app-site-association"  # apple_site::PATH
process = "hub"
auth = "public"
clients = ["apple"]
note = "Names the desktop app (`<team>.io.arugula.desktop`) for webcredentials. JSON, never a redirect, on every site."

[[route]]
method = "GET"
path = "/oauth/authorize"
process = "hub"
auth = "session"
clients = ["browser"]
note = "A registered client and an exact redirect address, PKCE S256. Without a session it sends the browser to control's page to sign in, and back here."

[[route]]
method = "POST"
path = "/oauth/consent"
process = "hub"
auth = "session"
clients = ["browser"]
note = "M229: the person's answer to the consent screen, from control's own origin, with the screen's single-use ticket in the hub session it was shown in. Allowed: kept per account and client until an unlink, and the code goes to the client; cancelled: access_denied."

[[route]]
method = "POST"
path = "/oauth/token"
process = "hub"
auth = "issuer_code"
clients = ["product"]

[[route]]
method = "GET"
path = "/oauth/userinfo"
process = "hub"
auth = "issuer_token"
clients = ["product"]

[[route]]
method = "GET"
path = "/oauth/hud"
process = "hub"
auth = "session"
clients = ["browser"]
note = "hud's forge assertion for a box registered as a client, in the fragment of its own page. Without a session it signs in first, as /oauth/authorize does."

# hud boxes bound to a project (M237, hud_box.rs): the box's server, with its secret, and its people on the hub's page.

[[route]]
method = "GET"
path = "/oauth/hud/members"
process = "hub"
auth = "client_secret"
clients = ["product"]
note = "A bound box's roster: its project's members now (the platform's answer), with numeric GitHub ids to match on. An unbound box gets 409 not_bound."

[[route]]
method = "POST"
path = "/oauth/hud/posts"
process = "hub"
auth = "client_secret"
clients = ["product"]
note = "A bound box's review, waiting ten minutes for its author to post it on the hub's own page: the answer is that page's address. Nothing is posted here."

[[route]]
method = "GET"
path = "/oauth/hud/post"
process = "hub"
auth = "session"
clients = ["browser"]
note = "The hub's page where a box review's author posts it into the object's thread, or doesn't: the text word for word, no script, no framing. Without a session it signs in first."

[[route]]
method = "POST"
path = "/oauth/hud/post"
process = "hub"
auth = "session"
clients = ["browser"]
note = "The author's answer, from that page only (same origin), once: posted via the box, if they may post there now."

# Account links (M229, links.rs): a product's server, with its link secret.

[[route]]
method = "POST"
path = "/oauth/links"
process = "hub"
auth = "client_secret"
clients = ["product"]
note = "Links the product's user to the account an ID token it was issued is for, only when the product's numeric GitHub id for that user is the account's. Idempotent; a user or account linked otherwise is a 409."

[[route]]
method = "GET"
path = "/oauth/links/{user}"
process = "hub"
auth = "client_secret"
clients = ["product"]
note = "The product's user's link, or 404 not_linked: how a product sees an unlink made on the platform page."

[[route]]
method = "DELETE"
path = "/oauth/links/{user}"
process = "hub"
auth = "client_secret"
clients = ["product"]

[[route]]
method = "POST"
path = "/auth/app"
process = "hub"
auth = "public"
clients = ["app"]
note = "The desktop app asks for a ticket (M48); rate-limited."

[[route]]
method = "POST"
path = "/auth/app/{id}/redeem"
process = "hub"
auth = "app_ticket"
clients = ["page"]
note = "Control's page in the app's webview, with the ticket's grant and verifier."

[[route]]
method = "GET"
path = "/api/app-login/{id}"
process = "hub"
auth = "session"
clients = ["page"]

[[route]]
method = "POST"
path = "/api/app-login/{id}/allow"
process = "hub"
auth = "session"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/register"
process = "hub"
auth = "sign_in"
clients = ["page"]
note = "A new account's first passkey, or one more for the session's account: that one needs one of its passkeys to agree (`register/step-up`) or, with none, a GitHub sign-in from the last ten minutes."

[[route]]
method = "POST"
path = "/auth/passkey/register/step-up"
process = "hub"
auth = "session"
clients = ["page"]
note = "The challenge one of the account's passkeys signs to add a new one: it names the account and the new passkey's id."

[[route]]
method = "POST"
path = "/auth/passkey/register/finish"
process = "hub"
auth = "sign_in"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/login"
process = "hub"
auth = "sign_in"
clients = ["page"]

[[route]]
method = "POST"
path = "/auth/passkey/login/finish"
process = "hub"
auth = "sign_in"
clients = ["page"]

