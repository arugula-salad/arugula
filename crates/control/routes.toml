# (`HubPort::daemons`). Its agents' powers in conversations (M197:
# `threads.read`, `threads.post`, `issues.write`, over a project or the
# owner's DMs) are given only here, by the machine's owner: the CLI's
# `arugula grants add`, or the platform page's switches.

