note = "Every change naming the account, its devices, its machines and the teams it disbands goes, and its deletion is one change that names nobody."
seen_by = ["litestream"]

# ---- the platform plane: what has to exist while every machine is asleep

[[table]]
name = "billing"
plane = "platform"
process = "platform"
holds = "metadata"
what = "Who pays: Stripe's customer and subscription ids, the seat item, the status."
why_asleep = "A plan holds with every machine off, and Stripe's webhooks come whenever."
with_account = "deleted"
note = "A team's go when the team does. An account with a paid plan cancels it before it can be deleted."
seen_by = ["litestream", "stripe", "posthog"]

[[table]]
name = "reported"
plane = "platform"
process = "platform"
holds = "metadata"
what = "How many hosted sandbox minutes have gone to Stripe."
why_asleep = "Minutes are reported hourly, whether or not anyone's machine is up."
with_account = "deleted"
seen_by = ["litestream", "stripe"]

