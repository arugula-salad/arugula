# Every table and view in control's database, and what it holds
# ("Two planes, two trust rules", aru-071). A test (`tables::` in
# src/db/tables.rs) builds a fresh database and fails when a table isn't
# here, or this names one that isn't there. "What control stores" in
# docs/control-e2e.md is written from this file: `just control-tables`.
#
# Each table:
# - `plane`: `machine` (what control needs to route and check: it can't
#   read what moves between a client and a machine) or `platform` (what has
#   to exist while every machine is asleep).
# - `process`: which of control's two processes owns it ("Control is two
#   processes: a hub and a platform", #1150): `hub` or `platform`. Every
#   table is the hub's until its feature moves (M137-M139 flip theirs); a
#   platform table is read only by the platform, through its own database
#   handle, and the hub reaches it only through `PlatformPort`. Not the
#   same as the plane: Shared Docs are platform-plane data the hub holds.
# - `holds`:
#   - `metadata`: ids, names, addresses, times, counts, public keys and
#     signed statements;
#   - `ciphertext`: encrypted to keys control never holds;
#   - `plaintext`: what people or their agents wrote, or a secret control can
#     read. A value control encrypts with a key of its own counts as
#     plaintext.
# - `what`: what a row is, for the doc.
# - `why_asleep`: why it has to exist while machines are asleep. Platform
#   plane only; empty on the machine plane.
# - `with_account`: what deleting an account (`Db::delete_account`) does
#   to its rows: `deleted`; `partly` (some go, some stay: `note` says which);
#   `kept` (`note` says why and for how long); `none` (nothing of any
#   account in it).
# - `seen_by`: the third parties (`[parties]` below) that see its rows, or
#   the facts in them. Every table has `litestream`: it copies the whole file.
#
# SQLite's own tables (`sqlite_%`) and an FTS5 table's shadow tables
# (`chat_fts_data` ...) aren't listed: they're the listed table's.

# What control never holds, for the doc.
never = [
    "private keys of any device or machine: Noise, signing, passkeys",
    "terminal bytes, snapshots, logs, scrollback; the lines of a pane nobody quoted into chat",
    "link keys (a link's fragment), and Shared Docs' keys",
    "the push payloads machines send, in the clear",
    "a person's own credentials: GitHub's OAuth token (used once at sign-in), the one-use user token a send is made with (used for one call, then revoked), forge tokens",
]

# Who else sees what control holds, for the doc.
[parties.litestream]
name = "Litestream's bucket"
sees = "Litestream copies the whole database to a bucket (Cloudflare R2, for the hosted control), so every table is there too, for as long as control's backups are kept. On Postgres, the platform's tables go there in its nightly dump instead: encrypted, kept 30 days. Cloud secrets are there sealed, and their key isn't."

[parties.managoat]
name = "Managoat"
sees = "Managoat runs Cloud workspaces and cloud runs, on Sprites VMs: it gets their specs, agents, prompts and secrets, and sends back their transcripts and approvals."

[parties.e2b]
name = "E2B"
sees = "E2B runs hosted workspaces' boxes: it holds their disks and memory, the env and metadata each is made with (the workspace, project, release and template ids), and the secrets in its broker."

[parties.posthog]
name = "PostHog"
sees = "PostHog gets product events, when control has a key for it: account, team and machine ids, a machine's version, OS and arch, plans, Labs flags and counts. No names, logins, addresses or content."

[parties.sprites]
name = "Sprites"
sees = "Sprites hosts hosted sandboxes: it knows each one's VM."

[parties.github]
name = "GitHub"
sees = "GitHub signs people in: it knows the identities control keeps for it. Through the GitHub App, linked repos' PRs, issues, checks and content come from it, it makes every token control mints and sees each one used, every draft sent goes to it, and it sends the webhooks."

[parties.stripe]
name = "Stripe"
sees = "Stripe bills, when control has a key for it: it holds the customers and subscriptions control keeps ids for, and gets sandbox minutes."

