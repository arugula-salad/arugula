holds = "metadata"
what = "What happened to a linked repo's PR or issue, as metadata: reviews and their state, review requests, state changes, with who and when. No text."
why_asleep = "Inboxes are computed from them with every machine asleep."
with_account = "none"
seen_by = ["litestream", "github"]

[[table]]
name = "forge_content"
plane = "platform"
process = "platform"
holds = "plaintext"
what = "A linked repo's PR and issue bodies, comments and review comments, with author and time. Only for a repo whose project turned on content mirroring; turning it off purges them."
why_asleep = "A project that opted in searches PR text with every machine asleep."
with_account = "none"
seen_by = ["litestream", "github"]

[[table]]
name = "drafts"
plane = "platform"
process = "platform"
holds = "plaintext"
what = "A comment, review or new issue for a linked repo, waiting for a person to send it: the project, the person it's for (and the agent and machine that wrote it, if one did), the target, the text, its state, and where it landed once sent."
why_asleep = "A person sends a draft from a phone with every machine asleep."
with_account = "deleted"
note = "Its drafts, and those in projects that go with it."
seen_by = ["litestream", "github"]

[[table]]
name = "inbox_items"
plane = "platform"
process = "platform"
holds = "metadata"
what = "A member's inbox: an item, why it's there (a review requested, a mention, failed checks), and when it was seen and done."
why_asleep = "The inbox is computed and pushed by the platform with every machine asleep."
with_account = "deleted"
seen_by = ["litestream"]

[[table]]
name = "github_token_mints"
plane = "platform"
process = "platform"
holds = "metadata"
what = "The audit log of every GitHub token the platform minted: installation or user token, the installation and repo, the permissions, who it was for, what for, and when. Never the token."
why_asleep = "Tokens are minted for reads, ingest and sends with every machine asleep."
with_account = "kept"
note = "Its mints stay in the audit log, naming it, so a token can be traced after the account goes, for as long as the log keeps a mint: a year, pruned hourly."
seen_by = ["litestream", "github"]

[[table]]
name = "forge_access"
plane = "platform"
process = "platform"
holds = "metadata"
what = "What GitHub said about a person's access to a repository (M165): their numeric GitHub id, the repository's name and owner, why not if not, and when it was asked by the database's clock. Kept 10 minutes, so every machine of the platform gives the same answer, to a read of a private repo's items, a daemon's live updates and a hosted box's token."
why_asleep = "Private repos' items are read from the platform with every machine asleep, each read checked against the reader's own GitHub access."
with_account = "kept"
note = "An answer names a GitHub id, not an account: it stops being used after 10 minutes, and goes at the next hourly prune."
seen_by = ["litestream", "github"]

[[table]]
name = "forge_access_drops"
plane = "platform"
process = "platform"
holds = "metadata"
what = "When a GitHub event last changed who may read a repo (M165): a repository's name, an owner's login or a person's GitHub id, and when, by the database's clock. Every `forge_access` answer asked before it is dropped."
why_asleep = "GitHub's webhooks arrive whether or not any machine is up, and a removed collaborator is cut off at once on every machine."
with_account = "none"
seen_by = ["litestream", "github"]

[[table]]
name = "platform_migrations"
plane = "platform"
process = "platform"
holds = "metadata"
what = "Which of the platform's numbered migrations (M142) its database has: each one's number, name, checksum, whether it's additive (older builds may start past it) and when it ran, or that it was found already in place on a database made before migrations."
why_asleep = "The platform checks its tables are the shape its code expects before it serves anything, whether or not any machine is up."
with_account = "none"
seen_by = ["litestream"]
