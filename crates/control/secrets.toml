# The deploy environments whose secrets the platform keeps (M209), and the
# names of the secrets their drivers use. Values are sealed with the
# project's own key (`arugula_platform::keys`) and are never here.
#
# An environment a project makes for itself (M217) is a row, with the
# names of its secrets on the row: it isn't listed. What's listed is an
# environment that code knows by name, such as a driver's (M219-M222):
# code names its secrets with `arugula_platform::environment_secret!("env",
# "NAME")`, which reads this file when it's compiled and doesn't compile
# for a secret that isn't here. Keep each environment's `name = "..."` and
# `secrets = [...]` on one line each: that's what it reads
# (`secrets_list` in src/db checks).
#
# Each environment:
# - `name`: what drivers call it.
# - `what`: what deploys to it.
# - `secrets`: the names of its secrets, as cloud secrets' names are
#   (`A-Z`, `0-9`, `_`; not a reserved prefix).

[[environment]]
name = "arugula-release"
what = "Arugula's own release, run as a deploy by the chant→Fly driver (M220, M221). Its secrets are added here as the driver names them."
secrets = []
