[package]
# The hub's library (#314): all of control but its binary, which is
# crates/arugula-control. It keeps its name, `arugula_control`, so its log
# targets are what they were before the split, and platform feature crates
# never sit under it.
name = "arugula-control-base"
# The hosted server's own workspace (server/Cargo.toml), not the root's.
workspace = "../../server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arugula control: accounts, devices, the directory and the relay"

[lib]
name = "arugula_control"

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
anyhow = { workspace = true }
aws-lc-rs = "1.18.1"
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
ciborium = "0.2.2"
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek = { workspace = true }
flate2 = "1.1.10"
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
arugula-core = { workspace = true }
arugula-control-common = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
# The platform's side of the seam, and nothing else of it (#314): a
# platform edit doesn't rebuild the hub. The binary makes the platform.
arugula-platform-api = { workspace = true }
libc = "0.2.189"
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
reqwest = { workspace = true, features = ["rustls", "http2", "json", "stream"] }
# Security notices by email (#1609): SMTP, whichever provider is behind it.
lettre = { workspace = true, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs", "hostname"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
russh = { workspace = true, features = ["aws-lc-rs"] }
rust-embed = { workspace = true, features = ["mime-guess"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.11.0"
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# routes.toml, which the gateway forwards the platform's routes from.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
aes-gcm = { workspace = true }
# The contract every HubPort keeps (hub_port.rs's tests).
arugula-platform-base = { workspace = true, features = ["contract"] }
# Every platform feature crate, registered, for the platform in the tests'
# hub (`App::for_tests`) and routes.toml's checks.
arugula-platform-all = { workspace = true }
hkdf = { workspace = true }
# tables.toml, the table manifest (src/db/tables.rs).

[features]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
# The platform page's build too (web/dist-platform, M151), which an
# in-process platform serves.
debug-embed = ["rust-embed/debug-embed", "arugula-platform-api/debug-embed"]
