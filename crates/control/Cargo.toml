[package]
name = "arugula-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arugula control: accounts, devices, the directory and the relay"

[[bin]]
name = "arugula-control"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
aws-lc-rs = "1.18.1"
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
ciborium = "0.2.2"
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
arugula-core = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
libc = "0.2.189"
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
reqwest = { workspace = true, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
russh = { workspace = true, features = ["aws-lc-rs"] }
rust-embed = { workspace = true, features = ["mime-guess"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
webpki-root-certs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }

[features]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
debug-embed = ["rust-embed/debug-embed"]
