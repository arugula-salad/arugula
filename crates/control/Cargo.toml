[package]
name = "arugula-control"
# The hosted server's own workspace (server/Cargo.toml), not the root's.
workspace = "../../server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arugula control: accounts, devices, the directory and the relay"

[[bin]]
name = "arugula-control"
path = "src/main.rs"

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
anyhow = { workspace = true }
aws-lc-rs = "1.18.1"
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
ciborium = "0.2.2"
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
arugula-core = { workspace = true }
arugula-control-common = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
arugula-platform = { workspace = true }
libc = "0.2.189"
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
reqwest = { workspace = true, features = ["rustls", "http2", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
russh = { workspace = true, features = ["aws-lc-rs"] }
rust-embed = { workspace = true, features = ["mime-guess"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# routes.toml, which the gateway forwards the platform's routes from.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
aes-gcm = { workspace = true }
# The contract every HubPort keeps (hub_port.rs's tests).
arugula-platform = { workspace = true, features = ["contract"] }
hkdf = { workspace = true }
# tables.toml, the table manifest (src/db/tables.rs).

[features]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
# The platform page's build too (web/dist-platform, M151), which an
# in-process platform serves.
debug-embed = ["rust-embed/debug-embed", "arugula-platform/debug-embed"]
