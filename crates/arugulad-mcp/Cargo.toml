[package]
name = "arugulad-mcp"
description = "The daemon's MCP server: /mcp, the tool table and the tools' calls, capabilities, a cloud workspace's calls and a hosted session's server"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true, features = ["schema"] }
arugulad-base = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
# MCP (M16), pinned as the base pins it.
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[lints]
workspace = true

[features]
# The checks of the whole tool list (`whole.rs`), which need every feature
# crate registered: the binary's tests turn it on and run them.
whole-tests = []
