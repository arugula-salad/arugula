[package]
name = "arugulad-agent"
description = "The daemon's agent and chat blocks (an ACP client) and the Claude Code conversations on this machine"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-e2e = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true }
arugulad-base = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
schemars = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal", "socket", "uio", "user"] }

[lints]
workspace = true

[features]
# What the mux's Labs build has (`Block::wrote_run`), as the base's `labs`:
# on by default, and turned on by the binary's.
default = ["labs"]
labs = ["arugula-mux/labs"]
