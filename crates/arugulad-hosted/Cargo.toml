[package]
name = "arugulad-hosted"
description = "The daemon in a hosted workspace's box: a box of its own, enrolling, its setup and snapshots, resumes, busy and idle"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
arugula-control-wire = { workspace = true }
arugula-e2e = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true }
arugulad-base = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
memchr = "2.8.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal", "ioctl", "user"] }

[lints]
workspace = true
