[package]
name = "arugulad-review"
description = "The daemon's diff and file blocks: views for checking an agent's work"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arugula-mux = { workspace = true }
arugula-proto = { workspace = true }
arugulad-base = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
