[package]
name = "arugula-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Its RustCrypto resolver only: its `std` feature turns on `ring/std`, which
# builds ring (a second crypto backend beside aws-lc-rs) for nothing (#466).
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto"] }
tokio = { workspace = true, features = ["sync", "io-util", "rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = { workspace = true }
tokio = { workspace = true, features = ["full"] }

tokio-tungstenite = { workspace = true }
