[package]
name = "arugulad-forge"
description = "The daemon's GitHub forge: pull requests and issues as blocks, their live updates through control, and what Labs' forges are built on"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-e2e = { workspace = true }
# The GitHub reader and the forge model (M160).
arugula-forge-github = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true, features = ["schema"] }
arugulad-base = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
arugula-proto = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
