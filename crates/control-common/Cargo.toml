[package]
name = "arugula-control-common"
# The hosted server's own workspace (server/Cargo.toml), not the root's.
workspace = "../../server"
# The workspace's version: control and the platform rebuild on a bump
# anyway, and product analytics report it (`$lib_version`).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What Arugula control's hub and platform both need: the database opener, API errors, rate limits, analytics and the signed principal"

[dependencies]
anyhow = { workspace = true }
arugula-e2e = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
# The issuer's tokens (`issuer`, M228): EdDSA JWTs and hud's assertions.
ed25519-dalek = { workspace = true }
# Litestream's flags (`backup`), which both binaries flatten into theirs.
clap = { workspace = true, features = ["derive", "env"] }
hmac = { workspace = true }
# Stopping Litestream with its last sync (`backup`).
libc = "0.2.189"
# HTTP/2 as before the server had its own workspace, when the daemon's
# reqwest turned it on for both (server/Cargo.toml).
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
# Only for its default features (post-quantum key exchange first, logging),
# which the CLI's rustls turned on for the server while they were one
# workspace: the hub's and the platform's TLS stays as it was.
rustls = "0.23.45"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process"] }
tracing = { workspace = true }
# The bundled roots, where a machine has none (`roots`).
webpki-root-certs = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
