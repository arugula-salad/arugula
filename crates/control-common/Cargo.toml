[package]
name = "arugula-control-common"
# The workspace's version: control and the platform rebuild on a bump
# anyway, and product analytics report it (`$lib_version`).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What Arugula control's hub and platform both need: the database opener, API errors, rate limits, analytics and the signed principal"

[dependencies]
anyhow = { workspace = true }
arugula-e2e = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
# Litestream's flags (`backup`), which both binaries flatten into theirs.
clap = { workspace = true, features = ["derive", "env"] }
hmac = { workspace = true }
# Stopping Litestream with its last sync (`backup`).
libc = "0.2.189"
reqwest = { workspace = true, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process"] }
tracing = { workspace = true }
# The bundled roots, where a machine has none (`roots`).
webpki-root-certs = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
