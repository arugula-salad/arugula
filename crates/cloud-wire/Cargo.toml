[package]
name = "arugula-cloud-wire"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What Arugula control's /api/cloud answers with: Cloud workspaces, tabs, agents and past runs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }

[features]
# TypeScript for the web client: arugula-proto's `ts` feature turns it on
# and puts these types in web/src/shared/proto.gen.ts (`just proto-ts`).
ts = ["dep:ts-rs"]

[lints]
workspace = true
