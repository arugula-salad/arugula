[package]
name = "arugula-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arugula-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }
tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# TypeScript for the types the web client uses: `just proto-ts` writes
# web/src/proto.gen.ts, and a test checks it's current.
ts = ["dep:ts-rs", "arugula-core/ts"]
# Client fixtures (#200): the format, normalizing and matching.
fixtures = []
# `arugula-fixture-server`, which serves a fixture's daemon side.
fixture-server = ["fixtures", "dep:tungstenite"]

[[bin]]
name = "arugula-fixture-server"
required-features = ["fixture-server"]

[lints]
workspace = true
