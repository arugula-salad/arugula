[package]
name = "arugula-proto"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arugula-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
schemars = { version = "1.0", optional = true }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }
# Only for the web client's copy of control's chat types (`ts`).
arugula-control-wire = { workspace = true, optional = true }
# And of its Cloud types (`ts`, M137).
arugula-cloud-wire = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# TypeScript for the types the web client uses: `just proto-ts` writes
# web/src/proto.gen.ts, and a test checks it's current.
ts = [
    "dep:ts-rs",
    "arugula-core/ts",
    "dep:arugula-control-wire",
    "arugula-control-wire/ts",
    "dep:arugula-cloud-wire",
    "arugula-cloud-wire/ts",
]
# JSON Schema for the types an MCP tool answers with (its `outputSchema`,
# #580); the daemon turns it on.
schema = ["dep:schemars"]
# Client fixtures (#200): the format, normalizing and matching.
fixtures = []
# `arugula-fixture-server`, which serves a fixture's daemon side.
fixture-server = ["fixtures", "dep:tungstenite"]

[[bin]]
name = "arugula-fixture-server"
required-features = ["fixture-server"]

[lints]
workspace = true
