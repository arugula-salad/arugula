[package]
name = "arugula-testkit"
description = "The test harness for arugulad's integration tests"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arugula-proto = { workspace = true, features = ["fixtures"] }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[lints]
workspace = true
