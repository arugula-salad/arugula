[package]
name = "arugula"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-e2e = { workspace = true }
arugula-proto = { workspace = true }
arugula-vt = { workspace = true }
ratatui = "0.29.0"
rustls = "0.23.45"
rustls-platform-verifier = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tungstenite = { workspace = true }
webpki-root-certs = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "poll", "signal", "ioctl", "hostname"] }

[features]
# Labs (Fountain's `arugula fountain runner` first): on by default, as in the
# daemon (see crates/daemon/src/labs/mod.rs). `--no-default-features` leaves
# it out.
default = ["labs"]
labs = []

[lints]
workspace = true

[dev-dependencies]
arugula-proto = { workspace = true, features = ["fixture-server"] }
proptest = { workspace = true }
