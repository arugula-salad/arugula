[package]
name = "arugula-core"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binaries carry the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }

[features]
# TypeScript for the types the web client uses (`just proto-ts`).
ts = ["dep:ts-rs"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
