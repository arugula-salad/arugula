[package]
name = "arugulad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
futures-util = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-e2e = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true }
arugula-vt = { workspace = true }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
# Path segments decoded as the router decodes them, for the access checks.
percent-encoding = "2.3.2"
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
rustls-platform-verifier = { workspace = true }
# The guest ssh server (M65), part of Labs.
russh = { workspace = true, features = ["aws-lc-rs"], optional = true }
# Agent recipes (#398): a Claude Code subagent file's frontmatter.
serde_norway = { version = "0.9.42", optional = true }
rust-embed = { workspace = true, features = ["mime-guess"] }
# MCP (M16), pinned: 3.x moves fast (S14).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
x509-parser = "0.18.1"
tower = { version = "0.5.3", features = ["util"] }
hex = { workspace = true }
url = { workspace = true }
webpki-root-certs = { workspace = true }
zstd = { workspace = true }

# ptys, signals, sockets: Unix only. Windows gets ConPTY and named pipes (M56).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "process", "fs", "ioctl", "signal", "poll", "socket", "uio", "hostname", "user", "dir"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = { workspace = true }
arugula-proto = { workspace = true, features = ["fixtures"] }
arugula-testkit = { path = "../testkit" }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
# instant-acme's features (aws-lc-rs): the defaults add ring (#466).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }

[target.'cfg(unix)'.dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["transport-streamable-http-client-unix-socket"] }

[features]
# Labs (Fountain first; see src/labs/mod.rs): on by default. Release builds
# have it all; `--no-default-features` leaves it out.
default = ["labs"]
labs = ["dep:russh", "dep:serde_norway"]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
debug-embed = ["rust-embed/debug-embed"]
