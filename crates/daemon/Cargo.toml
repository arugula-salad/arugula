[package]
name = "arugulad-base"
description = "The daemon arugulad is built on (crates/arugulad is its binary)"
# Not the workspace's version: a release bump would rebuild this crate and
# everything on it. The binary carries the release (arugula_core::version).
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
futures-util = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
arugula-control-wire = { workspace = true }
arugula-core = { workspace = true }
arugula-e2e = { workspace = true }
arugula-mux = { workspace = true }
arugula-proto = { workspace = true, features = ["schema"] }
arugula-vt = { workspace = true }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
# Path segments decoded as the router decodes them, for the access checks.
percent-encoding = "2.3.2"
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
rustls-platform-verifier = { workspace = true }
rust-embed = { workspace = true, features = ["mime-guess"] }
# MCP (M16), pinned: 3.x moves fast (S14).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
# wss:// for connect_async (Sprites, loam): TLS with the system's roots.
# Before the server had its own workspace (server/Cargo.toml) the daemon
# got this from arugula-control's, built beside it.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
x509-parser = "0.18.1"
tower = { version = "0.5.3", features = ["util"] }
hex = { workspace = true }
# A hosted builder's wipe (M263) looks for its secrets through the disk.
memchr = "2.8.3"
url = { workspace = true }
webpki-root-certs = { workspace = true }
zstd = { workspace = true }

# ptys, signals, sockets: Unix only. Windows gets ConPTY and named pipes (M56).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "process", "fs", "ioctl", "signal", "poll", "socket", "uio", "hostname", "user", "dir"] }

# The kernel's TCP table (sysctl), to tell who is on a loopback connection.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = { workspace = true }
arugula-proto = { workspace = true, features = ["fixtures"] }
arugula-testkit = { path = "../testkit" }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
# instant-acme's features (aws-lc-rs): the defaults add ring (#466).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }

[target.'cfg(unix)'.dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["transport-streamable-http-client-unix-socket"] }

[features]
# Labs is a crate of its own (arugulad-labs, surface src/lab_hooks.rs): the
# feature says this build has it, for what the base keeps of Labs (its
# flags, the machines VM panes run on). On by default; release builds have
# it, `--no-default-features` leaves it out. The GitHub forge
# (arugulad-forge, surface src/forges.rs) and the editor (arugulad-editor,
# src/editors.rs) are crates the binary registers or not, with no feature
# here.
default = ["labs"]
labs = ["arugula-mux/labs"]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
debug-embed = ["rust-embed/debug-embed"]
# The checks of the whole daemon (`whole` modules), which need every feature
# crate registered: the binary's tests turn it on and run them.
whole-tests = []
