# Generated from app.yaml by arugula-salad/planter's platform-app (needs.telemetry). Don't edit: the next
# build of main renders it again. Change app.yaml, or patch it from k8s/kustomization.yaml.
# A Grafana dashboard for redone-hello, "redone-hello (planter-apps)": its service's log, which home-cloud's loam log
# shipper (apps/apps-platform) sends to Loki as {namespace="planter-apps", app="redone-hello", runtime="loam"}, the
# labels the cluster gives its pods' logs, so the panel keeps its history if the app is promoted.
# Grafana loads every ConfigMap labelled grafana_dashboard: "1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: redone-hello-dashboard
  labels:
    app.kubernetes.io/name: redone-hello
    grafana_dashboard: "1"
data:
  redone-hello.json: |
    {
      "uid": "planter-redone-hello",
      "title": "redone-hello (planter-apps)",
      "tags": [
        "planter-apps",
        "loam"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "https://redone-hello.run.inevitable.fyi",
          "url": "https://redone-hello.run.inevitable.fyi",
          "type": "link",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Logs",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 20
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"planter-apps\", app=\"redone-hello\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
