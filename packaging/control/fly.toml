# The hosted Arugula control (control.arugula.io; the old
# control.illogical.widgets.wtf was retired in #535). One machine
# with its SQLite database on a volume, backed up off-site by Litestream
# when its secrets are set. Secrets (fly secrets set): the GitHub App's
# (GITHUB_APP_*); LITESTREAM_BUCKET, LITESTREAM_ENDPOINT,
# LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY (docs/control-ops.md,
# "Operating the hosted one"). Each release tag deploys it (release.yml's
# `control` job, M133); `just control-deploy` is for hotfixes.
app = "illogical-control"
primary_region = "ewr"
# On a stop, control lets Litestream sync one last time (up to 10 s).
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  ARUGULA_CONTROL_URL = "https://control.arugula.io"
  ARUGULA_CONTROL_LISTEN = "0.0.0.0:7690"
  ARUGULA_CONTROL_DB = "/data/control.db"
  ARUGULA_CONTROL_PROXY_HEADER = "Fly-Client-IP"
  # Relay sockets, all accounts together (#344): below soft_limit, so a
  # full relay leaves room for pages and sign-ins.
  ARUGULA_RELAY_MAX_TOTAL = "5000"
  # Blocks through control (M50, #150): b-<key>.arugula.run, a domain of
  # its own so block code is cross-site to control's page. DNS (*.arugula.run
  # and _acme-challenge, DNS-only) is on Cloudflare; the wildcard certificate
  # is Fly's (`fly certs list`).
  ARUGULA_CONTROL_BLOCK_DOMAIN = "arugula.run"
  # Public previews of hosted workspaces' ports (M187): <id>.arugula.site,
  # a registrable domain of its own. The platform reads the same value
  # (packaging/platform/fly.toml). DNS and the certificate: docs/control-ops.md.
  ARUGULA_PREVIEW_DOMAIN = "arugula.site"
  # Passkeys in the macOS app's window (D2): the Developer ID team that
  # signs it ("Developer ID Application: Jake Gaylor (HNDPMQPF22)"), named
  # in /.well-known/apple-app-site-association. Not a secret.
  ARUGULA_CONTROL_APPLE_TEAM_ID = "HNDPMQPF22"

[[mounts]]
  source = "control_data"
  destination = "/data"

[http_service]
  internal_port = 7690
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # An idle relay connection costs control about 28 KB (#174: 3,900 of them
  # took 121 MB in a 1 GB VM), so memory isn't the limit at these numbers;
  # open files are (control raises its own limit to the hard one at start,
  # and logs it). Past the soft limit Fly prefers another machine (there's
  # none yet); at the hard limit it queues new connections.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 6000
    hard_limit = 8000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/control.json"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
