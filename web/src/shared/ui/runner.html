<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>prototype</title>
<!-- The prototype kit (#699): the house look as opt-in `ar-` classes and `--ar-`
     tokens, written into every prototype before its own styles, so a prototype
     can start from them with nothing to import (the frame loads nothing). A
     template, so this page doesn't apply it. Colors are `light-dark(Latte,
     Slate)`: they follow the `color-scheme` the runner already sets and moves,
     and `scripts/prototype-kit.test.mjs` checks each against appearance.ts. The
     type scale is style.css's four most-used sizes (12px 123 times, 11px 71,
     13px 35, 15px 13; #687 will settle the real one). Nothing here selects an
     element, so a prototype that uses no `ar-` class renders as it did. -->
<template id="arugula-kit"><style>
:root {
  --ar-bg: light-dark(#eff1f5, #0c1118);
  --ar-surface: light-dark(#e6e9ef, #090d13);
  --ar-raised: light-dark(#ccd0da, #1a2230);
  --ar-raised-hover: light-dark(#bcc0cc, #243042);
  --ar-text: light-dark(#4c4f69, #d6dee9);
  --ar-muted: light-dark(#6c6f85, #8b98ab);
  --ar-subtle: light-dark(#5c5f77, #b4c0d0);
  --ar-faint: light-dark(#9ca0b0, #3a4658);
  --ar-border: light-dark(#ccd0da, #1a2230);
  --ar-accent: light-dark(#8839ef, #56c8dc);
  --ar-on-accent: light-dark(#ffffff, #06090d);
  --ar-danger: light-dark(#d20f39, #f2778a);
  --ar-ok: light-dark(#40a02b, #5fd394);
  --ar-warn: light-dark(#df8e1d, #f0b45a);
  --ar-text-xs: 11px;
  --ar-text-sm: 12px;
  --ar-text-md: 13px;
  --ar-text-lg: 15px;
  --ar-text-xl: 19px;
  --ar-text-2xl: 32px;
  --ar-text-doc: 38px;
  --ar-lh-xs: 16px;
  --ar-lh-sm: 16px;
  --ar-lh-md: 18px;
  --ar-lh-lg: 20px;
  --ar-lh-prose: 1.45;
  --ar-font: system-ui, sans-serif;
  --ar-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --ar-space-1: 4px;
  --ar-space-2: 8px;
  --ar-space-3: 12px;
  --ar-space-4: 16px;
  --ar-radius-sm: 6px;
  --ar-radius: 8px;
  --ar-radius-lg: 10px;
  --ar-shadow: 0 12px 40px light-dark(rgb(0 0 0 / 0.21), rgb(0 0 0 / 0.6));
  --ar-backdrop: rgb(0 0 0 / 0.4);
}

.ar-btn {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 6px 14px;
  border: 1px solid color-mix(in srgb, var(--ar-text) 18%, transparent);
  border-radius: var(--ar-radius-sm);
  background: color-mix(in srgb, var(--ar-text) 6%, transparent);
  color: var(--ar-text);
  font: 600 var(--ar-text-md)/1.2 var(--ar-font);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.ar-btn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--ar-text) 12%, transparent);
  border-color: color-mix(in srgb, var(--ar-accent) 60%, transparent);
}
.ar-btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.ar-btn-primary {
  background: var(--ar-accent);
  border-color: var(--ar-accent);
  color: var(--ar-on-accent);
}
.ar-btn-primary:hover:not(:disabled) {
  background: color-mix(in srgb, var(--ar-accent) 85%, var(--ar-text));
  border-color: var(--ar-accent);
}
.ar-btn-ghost {
  background: none;
  border-color: transparent;
}

.ar-chip {
  --c: var(--ar-faint);
  --ct: var(--ar-subtle);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 1px 8px;
  border: 1px solid var(--c);
  border-radius: 999px;
  background: color-mix(in srgb, var(--c) 12%, transparent);
  color: var(--ct);
  font: 600 var(--ar-text-sm)/1.3 var(--ar-mono);
  white-space: nowrap;
}
.ar-chip-accent { --c: var(--ar-accent); --ct: var(--ar-accent); }
.ar-chip-ok { --c: var(--ar-ok); --ct: var(--ar-ok); }
.ar-chip-warn { --c: var(--ar-warn); --ct: var(--ar-warn); }
.ar-chip-danger { --c: var(--ar-danger); --ct: var(--ar-danger); }

.ar-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ar-space-2) var(--ar-space-3);
  min-width: 0;
  margin: 0 0 var(--ar-space-4);
  padding: 0 0 var(--ar-space-3);
  border-bottom: 1px solid var(--ar-border);
  color: var(--ar-text);
  font: var(--ar-text-md)/1.3 var(--ar-font);
}
.ar-header > :is(h1, h2, h3) {
  flex: 0 1 auto;
  min-width: 0;
  margin: 0;
  font-size: var(--ar-text-lg);
  font-weight: 600;
  overflow-wrap: anywhere;
}
.ar-header > .ar-toolbar {
  margin-left: auto;
}

.ar-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 14px;
  padding: var(--ar-space-2) var(--ar-space-4);
  border-bottom: 1px solid color-mix(in srgb, var(--ar-border) 55%, transparent);
  color: var(--ar-text);
  font: var(--ar-text-md)/1.3 var(--ar-font);
}
.ar-row:hover {
  background: color-mix(in srgb, var(--ar-raised) 45%, transparent);
}
.ar-row > .ar-row-sub {
  grid-column: 1 / -1;
  color: var(--ar-muted);
  font-size: var(--ar-text-sm);
}

.ar-dialog {
  box-sizing: border-box;
  display: grid;
  gap: var(--ar-space-3);
  width: min(440px, 100%);
  padding: var(--ar-space-4);
  border-radius: var(--ar-radius-lg);
  background: var(--ar-raised);
  color: var(--ar-text);
  box-shadow: var(--ar-shadow);
  font: var(--ar-text-md)/1.3 var(--ar-font);
}
.ar-dialog > :is(h1, h2, h3) {
  margin: 0;
  font-size: var(--ar-text-lg);
  font-weight: 600;
}
.ar-dialog > .ar-dialog-buttons {
  /* The app's footer: right-aligned, Cancel first and the action last. */
  display: flex;
  justify-content: flex-end;
  gap: var(--ar-space-2);
}

.ar-menu {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  width: max-content;
  min-width: 190px;
  max-width: 100%;
  padding: 4px;
  border-radius: var(--ar-radius);
  background: var(--ar-raised);
  color: var(--ar-text);
  box-shadow: var(--ar-shadow);
  font: var(--ar-text-md)/1.3 var(--ar-font);
}
.ar-menu-item {
  display: block;
  box-sizing: border-box;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  border-radius: var(--ar-radius-sm);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.ar-menu-item:hover:not(:disabled) {
  background: var(--ar-raised-hover);
}
.ar-menu-item:disabled {
  color: var(--ar-muted);
  cursor: default;
}

.ar-empty {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 32px var(--ar-space-4);
  color: var(--ar-muted);
  font: var(--ar-text-md)/1.3 var(--ar-font);
  text-align: center;
}
.ar-empty > :is(h1, h2, h3) {
  margin: 0;
  color: var(--ar-text);
  font-size: var(--ar-text-lg);
  font-weight: 600;
}
.ar-empty > p {
  max-width: 420px;
  margin: 0 0 var(--ar-space-3);
}

.ar-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ar-space-2);
}
</style></template>
</head>
<body>
<script>
// The runner of a Doc's prototype (#506). The page is static: it
// waits for one message from its parent, then replaces itself with the
// prototype, the frame's policy first. Served by `srcdoc` where the page has
// no script CSP, and from control's proto origin where it has (the
// `Host::Proto` page in crates/control/src/blocks.rs); the web client's
// `prototype-frame.tsx` is the other side, and the message names are
// `prototype-messages.ts`'s. Bridge (#508): before the page, `window.arugula`
// (`copy`, `store.get/set/all`) asks the parent, which answers each request
// by id. The page has no fonts from a host: `data:` fonts only.
(function () {
  var POLICY =
    "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'";
  // The bridge's shim (#508): requests carry an id, replies come back as
  // messages, and only the parent's are taken.
  var SHIM =
    "<script>(function(){var n=0,w={};" +
    "addEventListener('message',function(e){if(e.source!==parent)return;var m=e.data;" +
    "if(!m||m.type!=='arugula.reply'||!w[m.id])return;var f=w[m.id];delete w[m.id];" +
    "m.ok?f[0](m.value):f[1](new Error(m.error||'refused'))});" +
    "function ask(t,x){return new Promise(function(a,b){var id=++n;w[id]=[a,b];" +
    "x.type=t;x.id=id;parent.postMessage(x,'*')})}" +
    "window.arugula={copy:function(text){return ask('arugula.copy',{text:String(text)})}," +
    "store:{get:function(key){return ask('arugula.store.get',{key:key})}," +
    "set:function(key,value){return ask('arugula.store.set',{key:key,value:value})}," +
    "all:function(){return ask('arugula.store.all',{})}}}})()</scr" + "ipt>";
  function onmessage(e) {
    // Only the parent, and only the first: after that, the page is the prototype's.
    if (e.source !== parent) return;
    var m = e.data;
    if (!m || m.type !== "arugula.html" || typeof m.html !== "string") return;
    removeEventListener("message", onmessage);
    var scheme = m.colorScheme === "dark" ? "dark" : "light";
    // The kit (#699): a <style>, read before document.open() drops this page.
    var kit = document.getElementById("arugula-kit").innerHTML;
    document.open();
    // The policy comes first in the same write, so nothing the prototype
    // writes can come before it.
    document.write(
      '<!doctype html><meta http-equiv="Content-Security-Policy" content="' + POLICY + '">' +
        '<meta id="arugula-scheme-meta" name="color-scheme" content="' + scheme + '">' +
        '<style id="arugula-scheme-style">:root{color-scheme:' + scheme + "}</style>" +
        kit +
        // The page's one listener: the parent can change the scheme later. (Opening
        // the document dropped this page's own.) It takes only that message, only from the parent.
        "<script>addEventListener('message',function(e){" +
        "if(e.source!==parent)return;var m=e.data;" +
        "if(!m||m.type!=='arugula.scheme')return;" +
        "var s=m.colorScheme==='dark'?'dark':'light';" +
        "var a=document.getElementById('arugula-scheme-meta'),b=document.getElementById('arugula-scheme-style');" +
        "if(a)a.content=s;if(b)b.textContent=':root{color-scheme:'+s+'}'});" +
        // Esc in the frame never reaches the Doc's page: say so (#507), for Full window.
        "addEventListener('keydown',function(e){if(e.key==='Escape')parent.postMessage({type:'arugula.escape'},'*')})</scr" + "ipt>" +
        SHIM +
        m.html,
    );
    document.close();
  }
  addEventListener("message", onmessage);
  // A frame can't be sent to before its listener is there: say when it is.
  parent.postMessage({ type: "arugula.ready" }, "*");
})();
</script>
</body>
</html>
