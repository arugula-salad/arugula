<g class="line" data-line="J1"><title>J1: one person, Mac app, from no account to a terminal</title><polyline class="track" points="110.0,327.0 270.0,327.0 420.0,330.0 570.0,283.0 720.0,283.0 870.0,283.0 1020.0,283.0" style="stroke: var(--j1)"/></g>
