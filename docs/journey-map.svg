<g class="line" data-line="J5"><title>J5: won&#39;t read docs: to a working agent</title><polyline class="track" points="110.0,351.0 270.0,351.0 420.0,354.0 570.0,412.0 720.0,412.0 870.0,412.0" style="stroke: var(--j5)"/></g>
<g class="line" data-line="J6"><title>J6: two people on a tailnet, no control</title><polyline class="track" points="110.0,357.0 270.0,357.0 720.0,532.0 1170.0,461.0 1290.0,532.0" style="stroke: var(--j6)"/></g>
