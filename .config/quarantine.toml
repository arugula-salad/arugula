# Flaky tests CI leaves out until they're fixed (docs/testing.md,
# "Quarantine"). One entry per test:
#
#   [[rust]]: `test`, the binary id and the test's name, as nextest prints
#   them (`arugulad::integration ssh::...`, `arugula-platform triggers::...`).
#   [[e2e]]: `spec`, the spec's path from the checkout's root, and `title`,
#   the test's own title.
#   Both: `issue`, the issue that tracks the fix (a number or a URL);
#   `until`, the day it comes back (YYYY-MM-DD, at most 14 days out); `why`,
#   one line.
#
# After changing this file run `just quarantine`: it writes the nextest
# configs' default-filter from it. Lint (`just test-scripts`) fails when an
# entry has no issue or is past its `until`: fix the test and delete the
# entry, or delete the test. quarantine-nightly.yml runs these alone, every
# night, without gating anything.

[[rust]]
test = "arugula-platform triggers::tests::session_feedback::round_three_is_refused"
issue = "https://app.arugula.io/p/prj_3e5d802cb4b08d43074df6c32f5344c1/issues/iss_44f336182dcf75495287bcf9fdcdb9ea"
until = "2026-11-10"
why = "Fails twice on macOS on unrelated commits (4f66cdc95, 2f33811ea)."
