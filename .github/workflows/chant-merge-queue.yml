# Generated by chant — do not edit directly. Regenerate with: chant ci workflow --install 'git config --global user.name "github-actions[bot]" && git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"' --token-secret CI_GREEN_TOKEN (in the workspace root)
name: chant-merge-queue

# The merge queue's verdict: passes when every phase ci.green requires passed
# on the group's commit, judged as chant ci tick judges. Require its job,
# chant-verdict, in the branch's ruleset.
on:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  checks: read

jobs:
  chant-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install what the verdict runs
        run: "git config --global user.name \"github-actions[bot]\" && git config --global user.email \"41898282+github-actions[bot]@users.noreply.github.com\""
      - name: Wait for the required phases on the group's commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes @intentius/chant@0.124.62 ci verdict --wait
