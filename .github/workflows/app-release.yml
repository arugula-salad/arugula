# An `app-v*` tag, the desktop app's release (#393), apart from the
# daemon's `v*` ones: the app carries no daemon it builds itself. Each job
# downloads arugulad and arugula from the latest daemon release (checked
# against its SHA256SUMS: `scripts/release sidecars`), which the app installs
# on a machine with none. Then it builds the app: a .deb, an .rpm and an
# AppImage for each Linux arch, a .dmg and a zipped app for each macOS arch, an
# installer for Windows. Then it publishes them through chant (#1986):
# `chant release cut` records release/app's release of the tag, and `chant
# release publish` (release/app/chant.config.ts) attaches them with
# SHA256SUMS to the tag's release, published never as latest
# (releases/latest is the daemon's), and replaces the rolling `app-latest`
# release, where the site's download links and the updater's endpoint
# point, with them and the updater's latest.json.
#
# Cut one only when crates/desktop changes: set its version in
# crates/desktop/Cargo.toml, then `git tag -a app-vX.Y.Z`.
#
# Secrets the app uses when they're set, and skips (saying which) when not:
# TAURI_SIGNING_PRIVATE_KEY and _PASSWORD (updater signatures; the publish
# needs them, since latest.json lists every platform's),
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (Developer ID signing and
# notarization, #177), APPLE_PROVISIONING_PROFILE (the Developer ID
# provisioning profile, base64, that lets the app use control's passkeys in
# its window, D2; scripts/macos-sign).
name: app-release
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

# scripts/release check-green: the tag's commit must have passed CI (#503),
# the app's lane of it (ci/green-app, #307). The repository variable ARUGULA_RELEASE_SKIP_GREEN=1 lets a release
# through anyway.
env:
  ARUGULA_RELEASE_SKIP_GREEN: ${{ vars.ARUGULA_RELEASE_SKIP_GREEN }}

jobs:
  # On the home cloud's runners (arugula-amd64, docs/development.md). The
  # app builds in its own container (`just desktop-linux`), as linux-arm64's
  # does on GitHub's runner.
  linux:
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          packages: gh
      - run: just bootstrap
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: scripts/release sidecars x86_64-unknown-linux-musl "$RUNNER_TEMP/sidecars"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # In an Ubuntu 22.04 container (podman); fails if the bundles need a
      # newer glibc than 2.35 (#170). x86_64 only: geek has no arm64
      # emulation for podman, so linux-arm64 builds that one.
      - run: just desktop-linux x86_64
        env:
          ARUGULA_DESKTOP_BINARIES: ${{ runner.temp }}/sidecars
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-linux-x86_64
          path: dist/arugula-desktop-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # GitHub's arm runner, free for a public repo (#287): the same container
  # build, natively.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: scripts/release sidecars aarch64-unknown-linux-musl "$RUNNER_TEMP/sidecars"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just desktop-linux aarch64
        env:
          ARUGULA_DESKTOP_BINARIES: ${{ runner.temp }}/sidecars
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-linux-aarch64
          path: dist/arugula-desktop-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/app-release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: |
          scripts/release sidecars aarch64-apple-darwin "$RUNNER_TEMP/sidecars-aarch64"
          scripts/release sidecars x86_64-apple-darwin "$RUNNER_TEMP/sidecars-x86_64"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed, notarized and stapled with the Developer ID when its secrets
      # are set; ad-hoc signed (and saying so) when not. The Intel app is
      # cross-compiled.
      - run: |
          ARUGULA_DESKTOP_BINARIES="$RUNNER_TEMP/sidecars-aarch64" just desktop-macos aarch64
          ARUGULA_DESKTOP_BINARIES="$RUNNER_TEMP/sidecars-x86_64" just desktop-macos x86_64
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-macos
          path: dist/arugula-desktop-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # GitHub's runner: Jake has no Windows machine (M54, #217).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      # main's warm build of the app (windows-desktop.yml); a tag's run
      # only reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop
          shared-key: windows-desktop
          add-job-id-key: false
          save-if: false
      # arugulad and arugula, with Microsoft's ConPTY, as the app carries
      # them (tauri.windows.conf.json).
      - run: |
          scripts/release sidecars x86_64-pc-windows-msvc "$RUNNER_TEMP/sidecars"
          b=crates/desktop/binaries
          mkdir -p "$b"
          cp "$RUNNER_TEMP/sidecars/arugulad.exe" "$b/arugulad-x86_64-pc-windows-msvc.exe"
          cp "$RUNNER_TEMP/sidecars/arugula.exe" "$b/arugula-x86_64-pc-windows-msvc.exe"
          cp "$RUNNER_TEMP/sidecars/conpty.dll" "$RUNNER_TEMP/sidecars/OpenConsole.exe" "$RUNNER_TEMP/sidecars/ConPTY-LICENSE.txt" "$b/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd crates/desktop && npx --yes @tauri-apps/cli@2 build --bundles nsis
      - run: |
          mkdir -p dist
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/desktop/Cargo.toml | head -1)
          product=$(sed -n 's/^ *"productName": "\(.*\)",$/\1/p' crates/desktop/tauri.conf.json)
          cp "crates/desktop/target/release/bundle/nsis/${product}_${v}_x64-setup.exe" dist/arugula-desktop-windows-x86_64-setup.exe
      # The updater installs the installer itself, signed with the updater
      # key (#384).
      - run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx --yes @tauri-apps/cli@2 signer sign dist/arugula-desktop-windows-x86_64-setup.exe >/dev/null
            echo "signed the installer for the updater"
          else
            echo "no updater signature: TAURI_SIGNING_PRIVATE_KEY isn't set"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-windows
          path: dist/arugula-desktop-windows-x86_64-setup.exe*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The release chant publishes (#1986): `chant release cut`'s dry run,
  # beside the builds, so a cut chant would refuse shows within a minute
  # instead of after them. The commit is the one CI passed
  # (`scripts/release cut-commit`). chant's cut reads ci/green, every
  # phase, not the app's lane: a commit with only ci/green-app is refused
  # here, and the release stops before anything is published. publish cuts
  # it for real, just before it publishes. Only publish waits for this job.
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.cut.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git fetch -q origin chant/lifecycle:chant/lifecycle
      - id: cut
        working-directory: release/app
        run: |
          sha=$(../../scripts/release cut-commit "$GITHUB_REF_NAME")
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          npx --yes @intentius/chant@0.124.63 release cut "$GITHUB_REF_NAME" --at "$sha"

  # Publishes what the build jobs made, through chant
  # (release/app/chant.config.ts), from a checkout of the cut's commit with
  # the files in dist/release (gitignored). The draft step titles the
  # release and gives it its notes first. The publish attaches every
  # download, the updater's bundles and signatures, SHA256SUMS and chant's
  # provenance statement to the draft and publishes it, never as latest;
  # then it replaces app-latest with a new release of the same files and
  # latest.json, whose URLs point at this tag's release. Moving app-latest
  # takes TAG_TOKEN: GITHUB_TOKEN gets 403 there (#526), as it does tagging
  # commits for chant-ci-green.
  publish:
    needs: [cut, linux, linux-arm64, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git fetch -q origin chant/lifecycle:chant/lifecycle
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-app-*
          merge-multiple: true
          path: dist/release
      - run: scripts/release sums "$GITHUB_REF_NAME" dist/release
      - run: scripts/release draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The cut records the release on chant/lifecycle and pushes it (a cut
      # that's there already is left as it is); the publish reads it.
      - working-directory: release/app
        run: |
          npx --yes @intentius/chant@0.124.63 release cut "$GITHUB_REF_NAME" --at "$(git rev-parse HEAD)" --yes
          npx --yes @intentius/chant@0.124.63 release publish "$GITHUB_REF_NAME" --yes
        env:
          ARUGULA_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TOKEN: ${{ secrets.CI_GREEN_TOKEN }}
      - run: scripts/release check-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
