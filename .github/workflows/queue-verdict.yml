name: queue-verdict

# The merge queue's verdict on a group: `chant-verdict`, the check its ruleset
# requires. It passes when every phase ci.green requires passed on the group's
# commit, judged as chant's tick judges main, and a job that failed gets one
# re-run first (scripts/queue-verdict), as chant's tick gives main's. Otherwise
# one flake throws a pull request out of the queue.
#
# Ours rather than chant's generated chant-merge-queue.yml, whose `chant ci
# verdict --wait` fails at the first red job, before a re-run can count. So
# ci.green doesn't set mergeQueue: `chant ci workflow` would write that file back.
# It keeps the merge_group triggers already on check.yml, windows.yml and
# windows-desktop.yml.
on:
  merge_group:
    types:
      - checks_requested

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  chant-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: scripts/queue-verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
