# A `v*` tag, the daemon's release, through chant (#1986): `chant release
# cut --lane daemon` records release/daemon's release of the tag's commit,
# which must be green in the daemon's lane, before anything is built. Then
# build Linux (x86_64, arm64, static) and macOS (arm64, and x86_64
# cross-compiled for Intel Macs) binaries, and a zip of arugulad and arugula
# for Windows (install.ps1's), each with the tag's version and notes written
# into its checkout (`scripts/release stamp`: no commit moves the version, and
# the notes are in the tag's message, #707). `chant
# release publish` (release/daemon/chant.config.ts) then attaches them to
# the tag's release with SHA256SUMS and publishes it as latest, commits the
# Homebrew formula to the tap and sends the editor extension to the
# marketplaces. Beside the publish, build the hosted workspace's E2B
# templates (M177, one per size: M266). No hosted control here: the same
# tag starts server-release.yml, which releases its hub and platform
# through chant (#1983). No desktop app: it has its own release, app-v*
# tags (app-release.yml, #393), and the daemon updates itself (#391).
name: release
on:
  push:
    tags: ["v*"]

# Read by default: only the cut (chant/lifecycle) and the publish write.
permissions:
  contents: read

# The tag's commit must have passed CI (#503): chant's cut refuses it
# otherwise. The repository variable ARUGULA_RELEASE_SKIP_GREEN=1 makes the
# cut ask for a person's override instead (`--override-green`,
# docs/development.md), and skips check-rare.
env:
  ARUGULA_RELEASE_SKIP_GREEN: ${{ vars.ARUGULA_RELEASE_SKIP_GREEN }}

jobs:
  # The release chant publishes (#1986), cut before anything is built:
  # `chant release cut --lane daemon` from the tag's commit, as CI passed
  # it, which must have ci/green-daemon and no ci/revoked-daemon. It records
  # the release on chant/lifecycle and pushes it; a cut that's there already
  # is left as it is. Every build waits for it, so a refused cut builds and
  # deploys nothing. With ARUGULA_RELEASE_SKIP_GREEN=1 it cuts under a
  # person's override (`--override-green`): the first run records the
  # request and stops with the `chant approve` line to run; re-run it once
  # that's done.
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: git fetch -q origin chant/lifecycle:chant/lifecycle
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # chant from release/tools' lockfile, not resolved afresh.
      - run: npm ci --prefix release/tools --no-fund --no-audit && echo "$PWD/release/tools/node_modules/.bin" >>"$GITHUB_PATH"
      - working-directory: release/daemon
        run: |
          override=()
          if [ "${ARUGULA_RELEASE_SKIP_GREEN:-}" = 1 ]; then override=(--override-green); fi
          chant release cut "$GITHUB_REF_NAME" --at "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" --lane daemon "${override[@]}" --yes

  # On the home cloud's runners (arugula-amd64, a fresh pod per job,
  # docs/development.md). A tag's run can only read main's caches and its
  # own, and main never saves release-static, so rust-cache starts cold.
  # A release compiles everything itself: not through sccache, whose store
  # pull requests and merge groups write too (check.yml's), so nothing in
  # what ships comes from another job's cache. x86_64 alone, as the
  # template jobs wait for this job; aarch64 builds beside it (linux-arm64).
  # It stays on a pod for that wait.
  linux:
    needs: cut
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Every release tag and its tree: control's build.rs serves
          # editors/nvim as a git repository with one commit for each
          # release that changed it (#1748), and fails here without them.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # Not check.yml's static: that builds at opt-level 1 (#868).
          cache-key: release-static
          packages: gh
      - run: just bootstrap
      # The rare jobs (#305), which the cut doesn't read; then the tag's
      # version into this checkout.
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: scripts/release stamp "$GITHUB_REF_NAME"
      - run: just static x86_64
      # arugulad and arugula for the template job's image (a tar keeps them
      # executable).
      - run: tar -cf "$RUNNER_TEMP/control-binaries.tar" -C "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release" arugulad arugula
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-binaries
          path: ${{ runner.temp }}/control-binaries.tar
          retention-days: 7
          compression-level: 1
      - run: just dist
      # The editor extension, from the daemon that carries it (#529).
      - run: '"$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/arugulad" _vsix dist'
      # For the publish job, which publishes what the build jobs made.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.vsix
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The arm64 tarball, cross-compiled with Zig: nothing deploys from it, so
  # it holds back only publish, which waits for Windows' longer job anyway.
  # On GitHub's runner, without sccache (as linux).
  linux-arm64:
    needs: cut
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # just static builds control here too: as the linux job's (#1748).
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: release-static-aarch64
          packages: gh
      - run: just bootstrap
      - run: scripts/release stamp "$GITHUB_REF_NAME"
      - run: just static aarch64
      - run: just dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    needs: cut
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release stamp "$GITHUB_REF_NAME"
      - run: just build
      - run: just build-macos-x86_64
      - run: just dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # GitHub's runner: Jake has no Windows machine (M54, #217).
  windows:
    needs: cut
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Zig for Ghostty's lib-vt, pnpm for the web client the daemon embeds.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      # main's warm target dir and Ghostty build
      # (windows-release-cache.yml); a tag's run only reads them.
      - run: echo "LIBGHOSTTY_VT_SYS_CACHE_DIR=$(cygpath -w "$HOME/.cache/libghostty-vt-sys")" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/libghostty-vt-sys
          key: ghostty-Windows-release-${{ hashFiles('vendor/libghostty-vt-sys/**', '.mise.toml') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      # arugulad and arugula, with Microsoft's ConPTY: the zip
      # (install.ps1's, M59).
      - run: scripts/release stamp "$GITHUB_REF_NAME"
      - run: scripts/windows-dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/arugula-*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Publishes what the build jobs made, through chant
  # (release/daemon/chant.config.ts): from a checkout of the tag's commit
  # (the cut's), unstamped, as `chant release publish` asks, with the files
  # in dist/release (gitignored). The draft step titles the release and
  # gives it its notes first, from the tag's message, and the formula step writes the Homebrew
  # formula's template there. The publish stages every target, then
  # reveals them in order: the tarballs, the Windows zip, the extension,
  # SHA256SUMS and chant's provenance statement on the draft, published as
  # latest; Formula/arugula.rb in the tap, pushed over SSH with its deploy
  # key (HOMEBREW_TAP_KEY); the extension on the VS Code Marketplace and
  # Open VSX. Run again, it resumes from chant's record and publishes
  # nothing twice.
  #
  # The marketplaces take the run's identity, with no stored token (#529):
  # - the VS Code Marketplace: the Entra app arugula-marketplace-publish
  #   (Jake's Default Directory; AZURE_CLIENT_ID and AZURE_TENANT_ID are
  #   repo variables), which trusts this repo's `marketplace` environment
  #   and is a Contributor on the arugula publisher (#934), signed in with
  #   azure/login. So this job runs in that environment (v* tags only).
  # - Open VSX: a trusted publisher on arugula-editor (this repo,
  #   release.yml), through this job's OIDC token.
  # A store that refuses the upload is a warning, not a failed release
  # (Open VSX has 406'd every release since 0.44.0, #1015). GitHub's
  # runner: it has the Azure CLI that azure/login needs.
  publish:
    needs: [cut, linux, linux-arm64, macos, windows]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: git fetch -q origin chant/lifecycle:chant/lifecycle
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - run: scripts/release sums "$GITHUB_REF_NAME" dist/release
      - run: scripts/release formula "$GITHUB_REF_NAME" dist/release
      - run: scripts/release draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # chant, and the vsce its marketplace target runs, from release/tools'
      # lockfile.
      - run: npm ci --prefix release/tools --no-fund --no-audit && echo "$PWD/release/tools/node_modules/.bin" >>"$GITHUB_PATH"
      - working-directory: release/daemon
        run: chant release publish "$GITHUB_REF_NAME" --yes
        env:
          ARUGULA_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
      - run: scripts/release check-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release's client fixtures (#200) and notes (#707) on main.
  # `scripts/release bump` commits them there right after it pushes the tag
  # (from the arugula-release deploy, with the arugula-io App's token, which
  # the "binaries check" ruleset lets push to main), since there's no bump
  # commit to carry them. This only checks: if main doesn't have
  # crates/proto/fixtures/releases/X.Y.Z or docs/releases/X.Y.Z.md, its
  # summary says to run `just release-fixtures X.Y.Z`. It never fails, and
  # runs whatever became of publish.
  fixtures:
    needs: [cut, publish]
    if: ${{ !cancelled() && needs.cut.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/release check-fixtures "$GITHUB_REF_NAME"

  # A hosted workspace's box (M177 #1238): packaging/hosted around the
  # tag's static arugulad and arugula, built on E2B as a template per
  # workspace size (M266), each tagged with the tag and snapshotted with
  # `arugulad --hosted` running: arugula-workspace (small, 2 vCPU, 2 GiB)
  # and arugula-workspace-large (8 vCPU, 8 GiB). One job per size, so a
  # failed one is re-run alone. The platform makes a workspace's box from
  # its size's template at its own version's tag
  # (crates/platform/src/compute/template.rs), so the tag is the record.
  # E2B_API_KEY is a key for E2B's project; without it the job fails. It
  # holds back nothing else: until it's done, the platform's creates of
  # that size for this version are refused. Never on a PR: tags only, like
  # this file.
  template:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    name: template (${{ matrix.size }})
    # E2B_API_KEY is the release environment's, which only v* tags reach.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: control-binaries
          path: ${{ runner.temp }}/control
      - run: tar -xf "$RUNNER_TEMP/control/control-binaries.tar" -C "$RUNNER_TEMP/control"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - run: scripts/ci-hosted-template publish "$GITHUB_REF_NAME" "$RUNNER_TEMP/control"
        env:
          ARUGULA_TEMPLATE_SIZES: ${{ matrix.size }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
