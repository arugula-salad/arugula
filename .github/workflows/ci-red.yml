# Tells people when main stays red, or a green commit is revoked (#524):
# scripts/ci-red opens, comments on or closes one issue, "main is red", and
# GitHub notifies the repo's watchers. Every hour, with the job token (no
# secret). Repository variables: ARUGULA_RED_HOURS (how long main may go
# without a green commit, 6 by default) and ARUGULA_RED_MENTION (people to
# @-mention when the issue opens, e.g. "@jhgaylor @lex00").
name: ci-red
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-red
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Not named like a required check (chant.workspace.json): its runs land
  # on main's head commit too.
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # All of main and every tag, the ci/ ones among them.
          fetch-depth: 0
      - run: scripts/ci-red
        env:
          GH_TOKEN: ${{ github.token }}
          ARUGULA_RED_HOURS: ${{ vars.ARUGULA_RED_HOURS || '6' }}
          ARUGULA_RED_MENTION: ${{ vars.ARUGULA_RED_MENTION }}
