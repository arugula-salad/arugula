# Tells people when main stays red, or a green commit is revoked (#524),
# and when a scheduled workflow's newest run failed (scripts/ci-nightly-red):
# scripts/ci-red opens, comments on or closes one issue, "main is red", and
# GitHub notifies the repo's watchers. Every hour and after each chant-ci-green
# run (which writes chant's per-commit records, #1678), with the job token (no
# secret). Repository variables: ARUGULA_RED_HOURS (how long main may go
# without a green commit, 6 by default) and ARUGULA_RED_MENTION (people to
# @-mention when the issue opens, e.g. "@jhgaylor @lex00").
name: ci-red
on:
  schedule:
    - cron: "23 * * * *"
  # The tick that records a commit red after its retry, or names the bisect's
  # culprit, is a chant-ci-green run: look right after it (#1678).
  workflow_run:
    workflows: [chant-ci-green]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-red
  cancel-in-progress: false

permissions:
  # actions: scripts/ci-nightly-red reads the scheduled workflows' runs.
  actions: read
  contents: read
  issues: write

jobs:
  # Not named like a required check (chant.workspace.json): its runs land
  # on main's head commit too.
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # All of main and every tag, the ci/ ones among them.
          fetch-depth: 0
      # scripts/ci-red reads chant's records with `chant ci list`.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: scripts/ci-red
        env:
          GH_TOKEN: ${{ github.token }}
          ARUGULA_RED_HOURS: ${{ vars.ARUGULA_RED_HOURS || '6' }}
          ARUGULA_RED_MENTION: ${{ vars.ARUGULA_RED_MENTION }}
      # The scheduled workflows, which ci/green doesn't count: an issue
      # each until a scheduled run or newer manual validation is green.
      - run: scripts/ci-nightly-red
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARUGULA_RED_MENTION: ${{ vars.ARUGULA_RED_MENTION }}
