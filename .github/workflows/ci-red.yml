# Tells people when main stays red for hours (#524), and when a scheduled
# workflow's newest run failed (scripts/ci-nightly-red): scripts/ci-red opens,
# comments on or closes one issue, "main is red", and GitHub notifies the
# repo's watchers. Every hour, with the job token (no secret). A red commit's
# at-once notices (ci.red, ci.culprit, ci.green) are chant's tick's, in
# chant-ci-green.yml, through ci.green.notify in chant.workspace.json
# (chant#4645). Repository variables: ARUGULA_RED_HOURS (how long main may go
# without a green commit, 6 by default) and ARUGULA_RED_MENTION (people to
# @-mention when the issue opens, e.g. "@jhgaylor @lex00").
name: ci-red
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-red
  cancel-in-progress: false

permissions:
  # actions: scripts/ci-nightly-red reads the scheduled workflows' runs.
  actions: read
  contents: read
  issues: write

jobs:
  # Not named like a required check (chant.workspace.json): its runs land
  # on main's head commit too.
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # All of main and every tag, the ci/ ones among them.
          fetch-depth: 0
      - run: scripts/ci-red
        env:
          GH_TOKEN: ${{ github.token }}
          ARUGULA_RED_HOURS: ${{ vars.ARUGULA_RED_HOURS || '6' }}
          ARUGULA_RED_MENTION: ${{ vars.ARUGULA_RED_MENTION }}
      # The scheduled workflows, which ci/green doesn't count: an issue
      # each until a scheduled run or newer manual validation is green.
      - run: scripts/ci-nightly-red
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARUGULA_RED_MENTION: ${{ vars.ARUGULA_RED_MENTION }}
