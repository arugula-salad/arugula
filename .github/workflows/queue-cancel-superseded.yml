name: queue-cancel-superseded

# When GitHub throws a merge group away (a group ahead failed, a pull request
# left the queue, the queue rebuilt), the old group's runs on its
# gh-readonly-queue ref keep going: 177 groups in the week to Nov 17, about
# 196 pool-min and 1,270 hosted min a day after their replacement existed
# (Arugula #1125). Each new group cancels the runs of the groups it replaced:
# scripts/queue-cancel-superseded says how it tells them apart from a live
# group, and leaves a run alone when it can't. Not a concurrency group keyed
# on the pull request: `chant ci workflow` writes check.yml's and windows*.yml's
# concurrency, and an expression can't take pr-N out of the ref.
on:
  merge_group:
    types:
      - checks_requested
  # By hand, with dry_run to see what it would cancel.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only say what it would cancel
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: scripts/queue-cancel-superseded
          sparse-checkout-cone-mode: false
      - name: Cancel the runs of the groups GitHub threw away
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            scripts/queue-cancel-superseded --dry-run
          else
            scripts/queue-cancel-superseded
          fi
