# Windows on GitHub's own runners (the Windows track, #224). The desktop
# app's installer builds in windows-desktop.yml, only when the app can
# change.
name: windows
# main runs it on every push (never pull requests); a branch runs by hand:
# `gh workflow run windows.yml --ref BRANCH`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only when the push changes what the suites read (scripts/suite-changed,
  # #868); chant counts a skipped workspace as passing.
  suite-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ask.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: ask
        run: if scripts/suite-changed "${{ github.event.before }}"; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  # M55 (#218): the workspace compiles on Windows, and its unit tests pass.
  # (control runs on Fly, and the integration tests use the Unix socket
  # until M56.) Under cargo-nextest (.config/nextest.toml's ci profile, as
  # on Linux): `cargo test` ran the test binaries one at a time, 4 min of
  # this job's 14 (2026-10-23). Clippy is workspace-clippy, beside it.
  workspace:
    needs: suite-changed
    if: ${{ needs.suite-changed.outputs.run == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      # Zig, for Ghostty's lib-vt (the version in .mise.toml). Not through
      # mise: its Windows shims are .cmd files, which the build script's
      # Command can't run.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # PowerShell 7 started once, alone, before the tests start it in
      # several daemons at once (#524): its first start on a fresh runner
      # is the slow one.
      - run: pwsh -NoLogo -NoProfile -Command Get-Date
      - run: cargo nextest run --workspace --exclude arugula-control
      # nextest doesn't run doctests.
      - run: cargo test --workspace --exclude arugula-control --doc

  # The workspace's clippy on Windows, apart from its tests: one after the
  # other they were the run's longest path (3 min, then 9).
  workspace-clippy:
    needs: suite-changed
    if: ${{ needs.suite-changed.outputs.run == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude arugula-control --all-targets -- -D warnings
