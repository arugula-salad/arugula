name: pull request (hosted)

# A pull request's first answer, on GitHub's runners alone (#306): the debug
# binaries and the Playwright specs its change is likely to reach (#718,
# scripts/pr-plan). Every spec, and all the rest, runs before anything lands:
# the merge queue's group runs check.yml. So a spec this leaves out costs a
# trip through the queue, not a red main. Nothing here runs on arugula-amd64
# or the Macs. GitHub's Linux runners are free for this public repository, so
# what it costs is wall time.
#
# Advisory: no ruleset requires pr-gate, and its summary says so.
#
# A fork's pull request gets no secrets, and nothing here needs one:
# without SCCACHE_WEBDAV_PASSWORD .github/actions/setup leaves sccache out
# and the build compiles cold. No pull_request_target: a pull request's code never runs
# with this repository's secrets or a write token.
#
# The jobs' names: chant matches main's required checks by name
# (chant.workspace.json's ci.green phases: lint, build, e2e*, ...). A pull
# request's check runs land on its head commit, which a squash merge
# leaves off main, but these are still named so that no phase's pattern
# matches them, as binaries.yml's are (docs/testing.md).
#
# Its build is cold for the Rust crates even with sccache: on this PR's
# first run (#1927) sccache hit only Ghostty's C and assembly (419 of 1018
# compiles, no Rust), and rust-cache found nothing, since main's caches
# then came from the pods (another checkout path, another set of toolchains)
# and a pull request doesn't save. It still built in under 7 minutes.
on:
  pull_request:

# A new push to the pull request cancels its run before.
concurrency:
  group: pull-request-hosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Empty on a fork's pull request: the build compiles without sccache.
  SCCACHE_WEBDAV_PASSWORD: ${{ secrets.SCCACHE_WEBDAV_PASSWORD }}
  # mise's GitHub downloads (Zig's, nextest's) share the runner's IP's rate
  # limit unauthenticated.
  GITHUB_TOKEN: ${{ github.token }}
  # As check.yml's, so the binaries are the ones main's build makes.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # What this change takes. binaries.yml's quick has the lint, so this run doesn't.
  plan:
    name: pr-plan
    runs-on: ubuntu-24.04
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      shards: ${{ steps.plan.outputs.shards }}
      only: ${{ steps.plan.outputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parents: the diff against the base.
          fetch-depth: 2
      - id: plan
        run: scripts/pr-plan | tee -a "$GITHUB_OUTPUT"

  # check.yml's build, on a hosted runner: Ubuntu 24.04, the glibc the
  # shards run on.
  build:
    name: pr-build
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: build
          ghostty-key: gnu
          base-packages: "false"
      - uses: ./.github/actions/build-debug
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  # check.yml's e2e shards, on this run's binaries: as many as the chosen specs fill.
  e2e:
    name: pr-e2e (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-debug
          claude-code: "true"
      - uses: ./.github/actions/e2e-shard
        with:
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}
          only: ${{ needs.plan.outputs.only }}

  # The run's one verdict, the check a ruleset would require: every job
  # above passed, or wasn't needed. Its summary says the run is advisory.
  gate:
    name: pr-gate
    needs: [plan, build, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## pull request (hosted): advisory"
            echo
            echo "No ruleset requires this run yet (#306): a red one doesn't block the merge."
            echo "These are the specs this change is likely to reach. The merge queue runs the whole suite before it lands."
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' >/dev/null; then
            echo "::error::a job failed or was cancelled (advisory: this doesn't block the merge)"
            exit 1
          fi
