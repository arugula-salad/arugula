name: presence

# arugula.stream's code (presence/: the relay, the TS packages, the demo
# and the server SDKs; #318 P1), on GitHub's runners: it runs on pull
# requests and on presence-toolkit's and the milestone branches' pushes,
# and the home cloud's pods run only main's pushes (check.yml). Only when
# a push or pull request touches presence/ or this file.
on:
  push:
    branches: [presence-toolkit, "p[0-9]*-*"]
    paths: ["presence/**", ".github/workflows/presence.yml"]
  pull_request:
    paths: ["presence/**", ".github/workflows/presence.yml"]
  workflow_dispatch:

concurrency:
  group: presence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The relay's toolchain (presence/relay/mise.toml) and the packages' (Node
# 24, pnpm 12, as web/ uses).
env:
  OTP_VERSION: "28.3"
  ELIXIR_VERSION: "1.19.2"

jobs:
  relay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/presence_test
    defaults:
      run:
        working-directory: presence/relay
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            presence/relay/deps
            presence/relay/_build
          key: relay-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('presence/relay/mix.lock') }}
          restore-keys: relay-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: presence/*/pnpm-lock.yaml
      # Each package has its own lockfile (no workspace); they link each
      # other (link:../core), so core and client install first.
      - name: Install
        run: for p in core client elements react demo meet; do (cd "presence/$p" && pnpm install --frozen-lockfile); done
      - name: core
        working-directory: presence/core
        run: pnpm exec tsc --noEmit && pnpm test
      - name: client
        working-directory: presence/client
        run: pnpm exec tsc --noEmit && pnpm test
      - name: elements
        working-directory: presence/elements
        run: pnpm exec tsc --noEmit && pnpm test && pnpm exec vite build
      - name: react
        working-directory: presence/react
        run: pnpm exec tsc --noEmit && pnpm exec vite build --config vite.pack.config.ts
      - name: demo
        working-directory: presence/demo
        run: pnpm exec tsc --noEmit && pnpm exec vite build
      - name: meet
        working-directory: presence/meet
        run: pnpm exec tsc --noEmit && pnpm exec vite build

  # The server SDKs: byte-identical tokens against presence/sdk/vectors.json.
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: presence/sdk/go/go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: node
        working-directory: presence/sdk/node
        run: npm test
      - name: python
        working-directory: presence/sdk/python
        run: python -m unittest discover -s tests
      - name: go
        working-directory: presence/sdk/go
        run: go vet ./... && go test ./...
      - name: ruby
        working-directory: presence/sdk/ruby
        run: ruby -Ilib test/test_token.rb

  sdk-elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presence/sdk/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - run: mix deps.get
      - run: mix test
