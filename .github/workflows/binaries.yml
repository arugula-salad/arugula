name: binaries

# The checks cheap enough for every pull request, on GitHub's runners: the
# home cloud's pods run only main's pushes (check.yml). binaries: no
# screenshots, recordings or builds in the repo (AGENTS.md, "Binaries").
# quick: the quick checks that otherwise first fail on main, after the
# merge: check.yml's lint (.github/actions/lint: shellcheck, rustfmt, the
# release scripts' tests, the generated files), gitleaks and THIRD_PARTY.md,
# by the recipes check.yml runs.
# desktop-xvfb: `just desktop-xvfb`, only for a pull request that changes
# the desktop app or its Xvfb tests (#1677; #1616 broke it unseen).
# notes: what the pull request means for people using Arugula (#722).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-binaries

  # Not named like check.yml's jobs: chant matches main's required checks by
  # name (docs/testing.md). Only pull requests; main runs these in check.yml.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks reads the pull request's commits.
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          # cargo-about: scripts/notices' version.
          tool: just,cargo-about@0.9.2
      # The notices read the crates' sources (cargo metadata and the
      # registry, no build) and web's node_modules (pnpm licenses): Node 24
      # and pnpm 12, as on main (.github/actions/setup). The lint's scripts
      # run on the same Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      # check.yml's lint: shellcheck, rustfmt, the release scripts' tests
      # and the generated files' checks.
      - uses: ./.github/actions/lint
      - name: No secrets in the pull request's commits
        run: scripts/ci-gitleaks "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: web's packages
        run: cd web && pnpm install --frozen-lockfile
      - name: THIRD_PARTY.md is current
        run: just notices-check

  # What the pull request means for people using Arugula: a note in docs/notes/, or
  # a commit saying none is needed (#722; scripts/pr-notes-check). A release's notes
  # are built from them.
  notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's commits and where it left its base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/pr-notes-check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Whether the pull request touches the desktop app or its Xvfb tests: the
  # files list from the API, so no checkout. A pull request that doesn't
  # skips desktop-xvfb and pays for this job alone. This workflow's own
  # file counts, so a change to the job runs it.
  desktop-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.ask.outputs.run }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if echo "$files" | grep -qE '^(crates/desktop/|packaging/desktop/|\.github/workflows/binaries\.yml$)'; then
            echo "the desktop app or its tests changed: running desktop-xvfb"
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "the desktop app and its tests are untouched: skipping desktop-xvfb"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  # The Linux desktop app under Xvfb in a container, as check.yml's job of
  # the same name runs it on main, but on GitHub's runners. check.yml gets
  # the musl daemon and CLI from its static job; here they're built in the
  # job (`just static-daemon`: no server workspace), cold, since only main
  # saves the build caches. The test image is pulled from GHCR (main pushes
  # it); when that fails, the recipe builds it (~6 min).
  desktop-xvfb:
    # Not check.yml's name: chant's claims phase counts a job by its name, and
    # this one shows up skipped on every push to main.
    name: desktop-xvfb (pull request)
    needs: desktop-changes
    if: needs.desktop-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: static
      - run: just bootstrap
      # opt-level 1 as check.yml's static job: these only run the tests.
      - run: just static-daemon x86_64
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      # A fork's token can't read packages: the pull fails and the image builds.
      - name: GHCR, for the test image
        continue-on-error: true
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: The desktop app under Xvfb (join, app, stale, platform)
        run: ARUGULA_DESKTOP_BINARIES="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release" just desktop-xvfb
        env:
          ARUGULA_DESKTOP_IMAGE_REPO: ghcr.io/arugula-salad/arugula-desktop-xvfb

  # The merge queue's check on a pull request (docs/development.md,
  # "Merging through the queue"): its ruleset requires `chant-verdict` by
  # name, on the pull request before it's queued and on its merge group
  # after. Here it's binaries, quick and notes; the group's is chant's
  # chant-merge-queue.yml, which judges the group by ci.green's required
  # phases, with one re-run of a failed job (ci.green.mergeQueue.retries). So this workflow has no merge_group trigger: its chant-verdict,
  # skipped on a group, would count as passed there.
  chant-verdict:
    # It always runs on a pull request and fails when a job it needs failed or
    # was cancelled: a required check that's skipped counts as passed, so
    # skipping it on a failure let #2312 merge with its notes check red and
    # hold the release train (#795). desktop-xvfb is skipped on most pull
    # requests, and a skipped job passes here. desktop-changes is here too, so
    # its failing can't pass as desktop-xvfb skipped.
    if: github.event_name == 'pull_request' && always()
    needs: [binaries, quick, notes, desktop-changes, desktop-xvfb]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          red=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"')
          if [ -n "$red" ]; then
            echo "$red"
            exit 1
          fi
          echo "binaries, quick and notes passed (and desktop-xvfb, when it ran); the merge queue runs check.yml on the group"
