name: release-train

# The daemon's release on a timer, when something's worth telling people
# (scripts/release-train). The repository variable ARUGULA_RELEASE_TRAIN=on turns it
# on. A manual run does the same, and is how to send one now.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

# One at a time: a release's rare jobs take longer than a look.
concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # All of main and every tag: the notes come from the range since the last.
          fetch-depth: 0
          # Not the job's own token: a tag it pushed would set off no workflow.
          token: ${{ secrets.CI_GREEN_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/release-train
        env:
          GH_TOKEN: ${{ secrets.CI_GREEN_TOKEN }}
          ARUGULA_RELEASE_TRAIN: ${{ vars.ARUGULA_RELEASE_TRAIN }}
