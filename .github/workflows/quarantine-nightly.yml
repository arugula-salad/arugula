# The quarantined tests (chant.workspace.json's ci.green.quarantine), alone,
# every night on main: CI's runs leave them out, so this is where they still
# run, and where one that's fixed shows it (docs/testing.md, "Quarantine";
# chant's "The scheduled run"). It gates nothing: ci/green doesn't read it,
# and its job is named like no check chant requires. A red run here says a
# quarantined test still fails; `chant ci quarantine report` says which
# passed. It sends nothing yet: ci.green.notify isn't set until chant's
# events reach Arugula's own issues (Arugula issue 774).
name: quarantine-nightly
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarantine-nightly
  cancel-in-progress: false

env:
  # retries = 1, as check.yml's: flaky reads as flaky here too.
  NEXTEST_PROFILE: ci
  GITHUB_TOKEN: ${{ github.token }}
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The compile cache (.github/actions/setup, #868): home-cloud's ci-cache.
  # Its write login is the ci-cache environment's, which only main and the
  # merge queue's groups reach, in the jobs that name it; every other job
  # (and a branch's run by hand) reads with the read-only one.
  SCCACHE_WEBDAV_WRITE: ${{ secrets.SCCACHE_WEBDAV_RW_PASSWORD != '' }}
  SCCACHE_WEBDAV_PASSWORD: ${{ secrets.SCCACHE_WEBDAV_RW_PASSWORD || secrets.SCCACHE_WEBDAV_RO_PASSWORD }}

jobs:
  quarantine:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) && 'ci-cache' || '' }}
      deployment: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          cache-key: quarantine
          ghostty-key: gnu
          claude-code: "true"
          packages: tmux
          user-manager: "true"
      - run: scripts/ci-env testnet
      - run: just bootstrap
      - name: Anything quarantined?
        id: any
        run: |
          set -euo pipefail
          tests="$(scripts/chant ci quarantine filter --phase test --runner list)$(scripts/chant ci quarantine filter --phase e2e --runner list)"
          if [ -n "$tests" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Nothing is quarantined"; echo "run=false" >> "$GITHUB_OUTPUT"; fi
      # reboot.rs drives Chromium (its watcher); the specs run in it.
      - name: Playwright's Chromium
        if: steps.any.outputs.run == 'true'
        run: just browsers chromium
      # The ssh tests' box binaries (ARUGULA_SSH_BINARIES), as check.yml's
      # static builds them.
      - name: static's binaries
        if: steps.any.outputs.run == 'true'
        run: just static x86_64
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      - name: The quarantined tests
        if: steps.any.outputs.run == 'true'
        run: ARUGULA_SSH_BINARIES="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release" E2E_PORT=$(scripts/free-port) just test-quarantined
        env:
          ARUGULA_REQUIRE_SYSTEMD: "1"
          E2E_CHROMIUM: "1"
      # Each quarantined test as passed, flaky, failed or not run, in the
      # job's summary.
      - name: What became of each
        if: always() && steps.any.outputs.run == 'true'
        run: |
          set -euo pipefail
          report() { # PHASE FILE...: chant's report on the files that are there
            local phase=$1 args=() f
            shift
            for f in "$@"; do [ -f "$f" ] && args+=(--junit "$f"); done
            [ ${#args[@]} -gt 0 ] || { echo "no JUnit for $phase"; return 0; }
            scripts/chant ci quarantine report --phase "$phase" "${args[@]}"
          }
          {
            echo '### Quarantined (chant.workspace.json)'
            echo '```'
            report test "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
            report e2e web/junit.xml
            scripts/chant ci quarantine check 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Failed specs' screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quarantine-failures
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Take the test stack down
        if: always()
        run: just testnet down
