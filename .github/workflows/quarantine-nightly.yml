# The quarantined tests (chant.workspace.json's ci.green.quarantine), alone,
# every night on main: CI's runs leave them out, so this is where they still
# run, and where one that's fixed shows it (docs/testing.md, "Quarantine";
# chant's "The scheduled run"). It gates nothing: ci/green doesn't read it,
# and its job is named like no check chant requires. A red run here says a
# quarantined test still fails; `chant ci quarantine report` sends
# ci.quarantine-passed through ci.green.notify for each that passed.
name: quarantine-nightly
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarantine-nightly
  cancel-in-progress: false

env:
  # retries = 1, as check.yml's: flaky reads as flaky here too.
  NEXTEST_PROFILE: ci
  GITHUB_TOKEN: ${{ github.token }}
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  SCCACHE_WEBDAV_PASSWORD: ${{ secrets.SCCACHE_WEBDAV_PASSWORD }}

jobs:
  quarantine:
    runs-on: arugula-amd64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: quarantine
          ghostty-key: gnu
          claude-code: "true"
      - run: scripts/ci-env testnet
      - run: just bootstrap
      - name: Anything quarantined?
        id: any
        run: |
          set -euo pipefail
          tests="$(scripts/chant ci quarantine filter --phase test --runner list)$(scripts/chant ci quarantine filter --phase e2e --runner list)"
          if [ -n "$tests" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Nothing is quarantined"; echo "run=false" >> "$GITHUB_OUTPUT"; fi
      # reboot.rs drives Chromium (its watcher); the specs run in it.
      - name: Playwright's Chromium
        if: steps.any.outputs.run == 'true'
        run: just browsers chromium
      # The ssh tests' box binaries (ARUGULA_SSH_BINARIES), as check.yml's
      # static builds them.
      - name: static's binaries
        if: steps.any.outputs.run == 'true'
        run: just static x86_64
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      - name: The quarantined tests
        if: steps.any.outputs.run == 'true'
        run: ARUGULA_SSH_BINARIES="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release" E2E_PORT=$(scripts/free-port) just test-quarantined
        env:
          ARUGULA_REQUIRE_SYSTEMD: "1"
          E2E_CHROMIUM: "1"
      # Each quarantined test as passed, flaky, failed or not run, and
      # ci.quarantine-passed for each that passed (the secret is the one
      # chant-ci-green.yml's tick sends through).
      - name: What became of each, and who is told
        if: always() && steps.any.outputs.run == 'true'
        env:
          ARUGULA_CI_SLACK_WEBHOOK: ${{ secrets.ARUGULA_CI_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          report() { # PHASE FILE...: chant's report on the files that are there
            local phase=$1 args=() f
            shift
            for f in "$@"; do [ -f "$f" ] && args+=(--junit "$f"); done
            [ ${#args[@]} -gt 0 ] || { echo "no JUnit for $phase"; return 0; }
            scripts/chant ci quarantine report --phase "$phase" "${args[@]}"
          }
          {
            echo '### Quarantined (chant.workspace.json)'
            echo '```'
            report test "$CARGO_TARGET_DIR/nextest/ci/junit.xml" "$CARGO_TARGET_DIR/nextest/ci/junit-server.xml"
            report e2e web/junit.xml
            scripts/chant ci quarantine check 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Failed specs' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-failures
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Take the test stack down
        if: always()
        run: just testnet down
