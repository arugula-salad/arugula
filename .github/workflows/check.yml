# Every push to main, as parallel as it goes (#287):
# - lint: the quick checks, on GitHub's runners;
# - on the home cloud's runners (arugula-amd64: a fresh pod per job,
#   docs/development.md):
#   - build and static: the debug and the box's (static) binaries, once;
#   - clippy: Linux, Apple silicon (cross; Intel's is macos-intel.yml's,
#     weekly), the desktop app (when the push
#     changes it: scripts/app-changed), and notices;
#   - test: `just test` (the Rust tests under nextest), built beside static
#     and run once static's binaries are in (scripts/ci-wait-job);
#   - core: the daemon and the CLI without Labs (`just check-core`, #452);
#   - testnet: the test stack's claims (ssh, then control);
#   - e2e: the Playwright specs in six shards; stack: those on the test
#     stack; perf: the specs that time things, once the shards are done;
#   - desktop-xvfb: the Linux desktop app's claims under Xvfb, against
#     static's binaries, in a test image kept on GHCR;
# - macos: test and, beside it, the WebKit specs, on our Macs' Tart VMs
#   (home-cloud's mac_runner; when the push changes what runs there: scripts/macos-changed;
#   main always).
# A push that changes none of what they read (scripts/suite-changed: the
# docs' prose, spikes, the desktop app...) runs lint and, for the app, its
# jobs (static, clippy's app half, desktop-xvfb); chant counts the skipped
# ones as passing (chant.workspace.json).
# Those jobs start from nothing (.github/actions/setup): the toolchain,
# GitHub's cache in place of kept build directories, and build's and
# static's binaries as artifacts in place of a shared run directory
# (scripts/ci-env). Each pod has Docker (a dind sidecar): the test stack
# (testnet/README.md) and the ssh tests in `just test` fail without it.
# Each boots systemd with a user manager for the runner (home-cloud's
# images/gha-runner, target systemd: #735), so the tests that start the
# daemon as a service run, and ARUGULA_REQUIRE_SYSTEMD fails them in test
# and core if it's ever missing instead of letting them skip. Only main's pushes (never other branches or pull requests), since
# most of it runs on our own machines; a branch runs by hand:
# `gh workflow run check.yml --ref BRANCH`.
name: check
on:
  push:
    branches: [main]
  workflow_dispatch:

# A new run by hand on a branch cancels its run in progress; main's runs
# all start and finish. Each of main's runs has a group of its own: GitHub
# keeps one pending run per group and cancels the one before, even without
# cancel-in-progress, so pushes close together left runs that never started
# and commits chant ci never decided (#524).
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXTEST_PROFILE: ci
  # sccache's cache (.github/actions/setup, #868): home-cloud's ci-cache.
  SCCACHE_WEBDAV_PASSWORD: ${{ secrets.SCCACHE_WEBDAV_PASSWORD }}
  # mise's GitHub downloads (nextest): unauthenticated, they share the
  # runner's IP's rate limit.
  GITHUB_TOKEN: ${{ github.token }}
  # Debug and test builds keep line tables only (backtraces keep their
  # files and lines; no variables for a debugger): a full rebuild's test
  # binaries were 1.2 GB instead of 2.3 GB, which the kept build
  # directories (scripts/ci-cap-target) and macOS's cache carry (#466).
  # Not faster to build: rust-lld links them at the same speed.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks reads the history.
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: shellcheck
        # The version geek has: the runner image's changes what it reports.
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Formatting
        # rust-toolchain.toml's toolchain, rustfmt only. Pull requests run it
        # too (binaries.yml's quick).
        run: rustup component add rustfmt && just fmt-check
      - name: install.sh and the release's glibc check
        run: shellcheck -s sh scripts/install.sh scripts/glibc-floor && shellcheck -s bash scripts/tests/*.sh scripts/dist-pack
      - name: Release scripts and ratchets
        run: just test-scripts
      - name: The web client's wire types are current (web/src/proto.gen.ts)
        run: just proto-ts check
      - name: The CI's and the test stack's scripts
        run: shellcheck -x scripts/ci-* scripts/free-port testnet/*.sh testnet/forges/*.sh testnet/hosts/*.sh testnet/editors/*.sh testnet/macos/*.sh && shellcheck -s sh testnet/editors/box/entrypoint.sh testnet/sshd/entrypoint.sh testnet/sshd-systemd/keys.sh testnet/git/entrypoint.sh testnet/tailnet/entrypoint.sh
      - name: No secrets
        # The whole history; a pull request's quick job scans its own commits.
        run: scripts/ci-gitleaks

  # The debug binaries, web/dist embedded (debug-embed: the specs run them
  # from other checkouts), for the specs and the test stack's CLI.
  build:
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: build
          # Ghostty for x86_64-linux-gnu, as build, core and test all build it
          # (clippy's adds macOS's, static's musl: their own).
          ghostty-key: gnu
      - run: just bootstrap
      - run: just web
      - run: mise exec -- cargo build -p arugulad -p arugula -p arugula-control --features arugulad/debug-embed,arugula-control/debug-embed
      - run: scripts/ci-env keep debug
      - name: Hand them to the jobs that need them
        run: tar -cf "$RUNNER_TEMP/run-debug.tar" -C "$CI_RUN" debug dist
      - uses: actions/upload-artifact@v4
        with:
          name: run-debug
          path: ${{ runner.temp }}/run-debug.tar
          retention-days: 1
          compression-level: 1
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  # The box's binaries: for the ssh tests, the test stack and
  # team-swarm-phones' box behind netem.
  static:
    needs: changes
    if: needs.changes.outputs.suite == 'true' || needs.changes.outputs.app == 'true'
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: static
      - run: just bootstrap
      # opt-level 1, not release's 3: these only run the tests (the ssh
      # tests, the test stack, desktop-xvfb), and release.yml builds what
      # ships. Measured on geek: the workspace's crates take 29% less CPU
      # (593 -> 421 CPU-s) (#868).
      - run: just static x86_64
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      - run: scripts/ci-env keep static
      - name: Hand them to the jobs that need them
        run: tar -cf "$RUNNER_TEMP/run-static.tar" -C "$CI_RUN" x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: run-static
          path: ${{ runner.temp }}/run-static.tar
          retention-days: 1
          compression-level: 1
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  clippy:
    needs: changes
    if: needs.changes.outputs.suite == 'true' || needs.changes.outputs.app == 'true'
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: clippy
          # The desktop app's system libraries (packaging/desktop/Containerfile),
          # for `just desktop-check` below.
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libasound2-dev libopus-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: just bootstrap
      - run: just web
      - if: needs.changes.outputs.suite == 'true'
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - if: needs.changes.outputs.suite == 'true'
        run: just check-macos
      # Only when the push changes what the app is built from
      # (scripts/app-changed): its own workspace, compiled for nothing else.
      - name: The desktop app
        if: needs.changes.outputs.app == 'true'
        run: just desktop-check
      - name: THIRD_PARTY.md is current
        run: just notices-check
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  # The daemon and the CLI built without the `labs` feature (crates/daemon/
  # src/labs/mod.rs): clippy and the tests. The ssh tests, which need
  # Docker, run in `test`.
  core:
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: core
          # Ghostty for x86_64-linux-gnu, as build, core and test all build it
          # (clippy's adds macOS's, static's musl: their own).
          ghostty-key: gnu
      - run: just bootstrap
      - run: just check-core
        env:
          ARUGULA_SKIP_DOCKER: "1"
          ARUGULA_REQUIRE_SYSTEMD: "1"
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  # Starts beside static, not after it: it builds the tests first, and
  # waits for static's binaries (the ssh tests' ARUGULA_SSH_BINARIES, all
  # it takes from static) only before they run. With `needs: static` it
  # started 4 min into the run, after static and a pod's queue, and was
  # the run's longest path (2026-10-18). #466 left it behind static while
  # the jobs shared geek; each has a pod of its own now.
  test:
    needs: changes
    if: needs.changes.outputs.suite == 'true'
    runs-on: arugula-amd64
    permissions:
      # scripts/ci-wait-job reads the run's jobs; the rest is the default's.
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          # Ghostty for x86_64-linux-gnu, as build, core and test all build it
          # (clippy's adds macOS's, static's musl: their own).
          ghostty-key: gnu
          claude-code: "true"
      - run: scripts/ci-env testnet
      - run: just bootstrap
      # reboot.rs drives Chromium (its watcher).
      - name: Playwright's Chromium
        run: just browsers chromium
      - name: The tests, built
        run: just test-build
      - name: Wait for static
        run: scripts/ci-wait-job static
      - name: static's binaries
        uses: actions/download-artifact@v4
        with:
          name: run-static
          path: ${{ runner.temp }}/artifacts
      - name: Into the run directory
        run: mkdir -p "$CI_RUN" && tar -xf "$RUNNER_TEMP/artifacts/run-static.tar" -C "$CI_RUN"
      # The suite, on what test-build built: `just test` would build the web
      # client again first, for nothing.
      - run: ARUGULA_SSH_BINARIES="$CI_RUN/x86_64-unknown-linux-musl/release" just test-run
        env:
          # The service tests run, or fail (testkit's user_manager).
          ARUGULA_REQUIRE_SYSTEMD: "1"
      - name: sccache's hits
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats
      - name: Take the test stack down
        if: always()
        run: just testnet down

  # The test stack's claims on fresh boxes, then, when the claims change,
  # each under BREAK=1, where it must fail (nightly: testnet-break.yml). One stack, the control profile's: it has every box the
  # ssh profile has, so the ssh claims run on it first, and building and
  # starting it once saves a second round.
  testnet:
    needs: [changes, build, static]
    runs-on: arugula-amd64
    # 8-13 min when it works; a hung claim held a pod for 45 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-debug run-static
      - run: scripts/ci-env testnet
      - run: just bootstrap
      # The relay claim's phones (web/fixtures/m52-phones.ts): a Pixel in
      # Google Chrome itself, not Playwright's Chromium, and an iPhone in
      # WebKit. geek had both, with their system libraries.
      - name: Playwright's browsers
        run: just browsers
      - name: Google Chrome
        run: command -v google-chrome >/dev/null || (cd web && pnpm exec playwright install --with-deps chrome)
      - name: Its binaries, this run's
        run: |
          echo "ARUGULA_TESTNET_BINARIES=$CI_RUN/x86_64-unknown-linux-musl/release" >> "$GITHUB_ENV"
          echo "ARUGULA_SSH_BINARIES=$CI_RUN/x86_64-unknown-linux-musl/release" >> "$GITHUB_ENV"
          echo "ARUGULA_CLI=$CI_RUN/debug/arugula" >> "$GITHUB_ENV"
      - name: The control profile's stack
        run: just testnet down && just testnet up control
      - name: The claims
        run: just testnet test ssh && just testnet test control
      # Only when the claims or the stack change (scripts/testnet-changed):
      # it checks that each claim can fail, not the product, and was more
      # than half this job. testnet-break.yml runs it every night (#868).
      - name: The claims under BREAK=1
        if: needs.changes.outputs.testnet == 'true'
        run: just testnet break ssh && just testnet break control
      - name: Take the test stack down
        if: always()
        run: just testnet down

  e2e:
    needs: build
    runs-on: arugula-amd64
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-debug
          claude-code: "true"
      - run: scripts/ci-env use
      - run: just bootstrap
      - name: Playwright's browsers
        run: just browsers
      # Shards by recorded time (web/scripts/e2e-shard.mjs, e2e/durations.json),
      # not Playwright's --shard by count: six of those ran 155-316 s (#868).
      # Each keeps its JSON report so `just e2e-durations RUN` can refresh
      # the times.
      - name: The Playwright specs, shard ${{ matrix.shard }} of 6
        run: |
          port=$(scripts/free-port)
          cd web
          mapfile -t files < <(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6)
          # No files would run every spec in every shard.
          [ ${#files[@]} -gt 0 ] || { echo "e2e-shard listed nothing" >&2; exit 1; }
          E2E_PORT=$port pnpm exec playwright test "${files[@]}"
        env:
          E2E_CHROMIUM: "1"
          E2E_SET: rest
          E2E_TIMINGS: ${{ runner.temp }}/e2e-timings.json
      - name: The shard's times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-timings.json
          retention-days: 30
          if-no-files-found: ignore
      # A failed spec's screenshot (playwright.config.ts), kept a week.
      - name: Failed specs' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The specs on the test stack (team-swarm-phones' box behind netem).
  stack:
    needs: [build, static]
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-debug run-static
          claude-code: "true"
      - run: scripts/ci-env use
      - run: scripts/ci-env testnet
      - run: just bootstrap
      # team-swarm-phones' phones are WebKit's.
      - name: Playwright's browsers
        run: just browsers
      - name: The Playwright specs on the test stack
        run: port=$(scripts/free-port) && cd web && E2E_PORT=$port pnpm exec playwright test
        env:
          E2E_CHROMIUM: "1"
          E2E_SET: stack
      # A failed spec's screenshot (playwright.config.ts), kept a week.
      - name: Failed specs' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-failures
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Take the test stack down
        if: always()
        run: just testnet down

  # The specs that time things (E2E_SET=perf: the frame rates, editors'
  # times to a file), beside the shards since #868. The editors' times are
  # reported against their 3 s budget in the job's summary, not asserted
  # (web/e2e/timing.ts): shared pods put them over with nothing broken. They waited for the
  # shards when six browsers shared geek with them, and the wait put ~3 min
  # on the end of every run; each job has its own pod now and the nodes
  # sit at 13-28% CPU (its one recent failure came while it waited, under
  # four overlapping runs). Not a required check (chant.workspace.json).
  perf:
    needs: build
    runs-on: arugula-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-debug
          claude-code: "true"
      - run: scripts/ci-env use
      - run: just bootstrap
      # editors.spec opens a file from an iPhone (WebKit) too.
      - name: Playwright's browsers
        run: just browsers
      # Google Chrome itself, not Playwright's Chromium: editors.spec's blocked third-party cookies are a real Chrome profile's. geek had it.
      - name: Google Chrome
        run: command -v google-chrome >/dev/null || (cd web && pnpm exec playwright install --with-deps chrome)
      - name: The specs that time things
        run: port=$(scripts/free-port) && cd web && E2E_PORT=$port pnpm exec playwright test
        env:
          E2E_CHROMIUM: "1"
          E2E_SET: perf
          E2E_TIMINGS: ${{ runner.temp }}/perf-report.json
      # Each timing against its budget, over budget marked (web/scripts/perf-summary.mjs).
      - name: The timings, in the summary
        if: always()
        run: node web/scripts/perf-summary.mjs "$RUNNER_TEMP/perf-report.json" >> "$GITHUB_STEP_SUMMARY"
      # A failed spec's screenshot (playwright.config.ts), kept a week.
      - name: Failed specs' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-failures
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Linux desktop app under Xvfb, in a container (#317): `just
  # desktop-xvfb`'s join, app (bare, links and nautilus among its claims)
  # and stale, against static's binaries. The recipe builds the app itself,
  # in a test image it pulls from GHCR by what it's built from (a fresh
  # pod built it for 6 min each run); main pushes it when it's new. Not
  # named desktop: that's the Windows job chant.workspace.json requires.
  desktop-xvfb:
    needs: [changes, static]
    if: needs.changes.outputs.suite == 'true' || needs.changes.outputs.app == 'true'
    runs-on: arugula-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The app builds in the image, from crates/desktop alone (its own
      # dist, not web's): no toolchain, web client or mise here.
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          fetch: run-static
      - name: GHCR, for the test image
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: The desktop app under Xvfb (join, app, stale)
        run: ARUGULA_DESKTOP_BINARIES="$CI_RUNS/$GITHUB_RUN_ID/x86_64-unknown-linux-musl/release" just desktop-xvfb
        env:
          ARUGULA_DESKTOP_IMAGE_REPO: ghcr.io/arugula-salad/arugula-desktop-xvfb
          ARUGULA_DESKTOP_IMAGE_PUSH: ${{ github.ref == 'refs/heads/main' && '1' || '' }}

  # What the push changed (#868): suite, the suites' inputs
  # (scripts/suite-changed); app, the desktop app's (scripts/app-changed);
  # macos, what runs on macOS (scripts/macos-changed: main's always do, a
  # branch's only when it changes that); testnet, the test stack's claims
  # (scripts/testnet-changed).
  changes:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.ask.outputs.suite }}
      app: ${{ steps.ask.outputs.app }}
      macos: ${{ steps.ask.outputs.macos }}
      testnet: ${{ steps.ask.outputs.testnet }}
    steps:
      - uses: actions/checkout@v4
      - id: ask
        run: |
          before="${{ github.event.before }}"
          for c in suite app macos testnet; do
            # Only the answer into the outputs: the scripts say why on stdout.
            if "scripts/$c-changed" "$before"; then a=true; else a=false; fi
            echo "$c=$a" >> "$GITHUB_OUTPUT"
          done

  # Apple silicon, on our Macs since #868 (GitHub's macos-15 before: when
  # jake-mini had the one runner, every run waited 12-27 min for it; now
  # agent5, jake-mini and agentnan each run one VM at a time, shared with
  # the releases). No Docker there, so the ssh tests skip
  # (ARUGULA_SKIP_DOCKER=1, loudly); test runs them in the cluster. `just test`
  # and the WebKit specs on runners of their own: one after the other they
  # were the run's longest job.
  macos:
    needs: changes
    if: needs.changes.outputs.suite == 'true' && needs.changes.outputs.macos == 'true'
    # Our Macs (home-cloud's mac_runner: each job in a throwaway Tart VM, M4,
    # 5 cores, 6 GiB, from a golden image with Rust, mise, just, Node 24 and
    # pnpm 12), not GitHub's macos-15 (#868). The steps below skip what the
    # image has, so they still run on GitHub's if this goes back.
    runs-on: [self-hosted, macos-arm64]
    strategy:
      fail-fast: false
      matrix:
        part: [test, webkit]
    env:
      ARUGULA_SKIP_DOCKER: "1"
      # mise's GitHub downloads (nextest): unauthenticated, they share the
      # runner's IP's rate limit and ran out.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: bash 4.4+ (macOS ships 3.2; the shell integration tests need PS0)
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: Rust (rust-toolchain.toml's)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt,clippy
      - name: mise (it brings the Zig libghostty needs, from .mise.toml)
        run: |
          command -v mise >/dev/null || curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: What the image has
        id: have
        run: |
          case "$(node --version 2>/dev/null)" in v24.*) echo node=true ;; *) echo node=false ;; esac >> "$GITHUB_OUTPUT"
          case "$(pnpm --version 2>/dev/null)" in 12.*) echo pnpm=true ;; *) echo pnpm=false ;; esac >> "$GITHUB_OUTPUT"
          if command -v just >/dev/null; then echo just=true; else echo just=false; fi >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        if: steps.have.outputs.just != 'true'
        with:
          tool: just
      # Linux's: Node 24 and pnpm 12 (.github/actions/setup).
      - uses: actions/setup-node@v4
        if: steps.have.outputs.node != 'true'
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        if: steps.have.outputs.pnpm != 'true'
        with:
          version: 12
      # The compile cache Linux's jobs share (.github/actions/setup, #868):
      # a fresh VM starts with no build at all.
      - uses: taiki-e/install-action@v2
        if: env.SCCACHE_WEBDAV_PASSWORD != ''
        with:
          tool: sccache@0.18.0
      - name: Compile through sccache
        if: env.SCCACHE_WEBDAV_PASSWORD != ''
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_WEBDAV_ENDPOINT=https://ci-cache.inevitable.fyi"
            echo "SCCACHE_WEBDAV_USERNAME=arugula-ci"
            echo "SCCACHE_WEBDAV_KEY_PREFIX=arugula"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
      # The two build different things (test: the tests, with the
      # dev-dependencies' features): a cache each.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      # Ghostty's checkout and Zig's caches (.github/actions/setup's, #868).
      - name: Ghostty's cache
        run: echo "LIBGHOSTTY_VT_SYS_CACHE_DIR=$HOME/.cache/libghostty-vt-sys" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/libghostty-vt-sys
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-${{ hashFiles('vendor/libghostty-vt-sys/**', '.mise.toml') }}
      # mise's Zig (for libghostty) and nextest, kept between runs: Zig's
      # community mirror answered 429 once and failed the job (#524).
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}
      # Playwright's browsers: a fresh VM has none.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: just bootstrap
      # reboot.rs drives Chromium.
      - name: Playwright's Chromium
        if: matrix.part == 'test'
        run: just browsers chromium
      - if: matrix.part == 'test'
        run: just test
      - name: Playwright's WebKit
        if: matrix.part == 'webkit'
        run: just browsers webkit
      - name: The WebKit specs (Safari's engine)
        if: matrix.part == 'webkit'
        run: just e2e-webkit
        env:
          E2E_PORT: "7769"
      # A failed spec's screenshot (playwright.config.ts), kept a week.
      - name: Failed specs' screenshots
        if: failure() && matrix.part == 'webkit'
        uses: actions/upload-artifact@v4
        with:
          name: webkit-failures
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
