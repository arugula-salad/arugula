# Intel Macs (#227): test, build and package natively on GitHub's Intel
# macOS runner, as `just test` and the release steps run on jake-mini for
# Apple silicon. Cold, it takes about an hour, so it runs weekly on main and
# by hand (`gh workflow run macos-intel.yml --ref BRANCH`) for changes that
# touch macOS. It lints the Intel build too: check.yml lints only Apple
# silicon's, whose lints Intel's almost never differ from (#868). The tarball and the app are kept as artifacts for
# trying on an Intel Mac; the release itself cross-compiles them on
# jake-mini (release.yml).
name: macos-intel
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch replaces the one in progress.
concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No Docker on GitHub's Macs: the ssh and test-stack tests skip, loudly,
  # as on check.yml's macos job (they run on Linux). Without it guest_ssh
  # failed every week from 2026-10-05.
  ARUGULA_SKIP_DOCKER: "1"
  # mise's GitHub downloads (nextest): unauthenticated, they share the
  # runner's IP's rate limit and ran out.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Not named macos-*: chant.workspace.json's "macos*" is check.yml's macOS
  # jobs, and a scheduled run lands on main's latest commit.
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: bash 4.4+ (macOS ships 3.2; the shell integration tests need PS0)
        run: brew install bash
      - name: Rust (rust-toolchain.toml's)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt,clippy
      - name: mise (it brings the Zig libghostty needs, from .mise.toml)
        run: |
          # mise.run's installer downloads from GitHub itself, without retrying,
          # so the install as a whole is tried again (#797).
          if ! command -v mise >/dev/null; then
            curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/mise-install.sh" https://mise.run
            for i in 1 2 3; do sh "$RUNNER_TEMP/mise-install.sh" && break; sleep 10; done
            "$HOME/.local/bin/mise" --version
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/desktop -> target
      # mise's Zig (for libghostty) and nextest, kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}
      - run: just bootstrap
      - run: just web
      - name: Clippy (Intel's own; check.yml lints Apple silicon's)
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - run: just test
      - run: just build
      - run: just dist
      - name: The desktop app
        run: just desktop
      - uses: actions/upload-artifact@v4
        with:
          name: arugula-macos-x86_64
          path: |
            dist/arugula-*-x86_64-apple-darwin.tar.gz
            dist/arugula-desktop-macos-x86_64.zip
          if-no-files-found: error
