# Docker Hub's images that CI pulls, copied to GHCR
# (ghcr.io/arugula-salad/ci/<name>), public, so CI never pulls them from
# Docker Hub: a pod's fresh dind pulls without credentials, and Docker
# Hub's anonymous limit (429 toomanyrequests) took out five of main's jobs
# at once on 2026-10-28. The list is .github/ci-images.txt.
#
# By hand, weekly (upstream's tags move: Debian's and Postgres's fixes),
# and when the list changes on main. Each image is copied by tag with every
# platform, its manifest unchanged (crane copy: the same digest as Docker
# Hub's), and only when Docker Hub's digest differs from the mirror's
# (a HEAD each, which Docker Hub doesn't count). The run's summary records
# every image's digest.
name: mirror-images
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - .github/ci-images.txt
      - .github/workflows/mirror-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-images

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR: ghcr.io/arugula-salad/ci
      CRANE: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - uses: actions/checkout@v4
      - name: crane
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/$CRANE/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: GHCR
        run: echo "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Copy
        run: |
          set -uo pipefail
          failed=0
          {
            echo "| image | mirror | digest | |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r image; do
            case "$image" in ''|'#'*) continue ;; esac
            dst="$MIRROR/$image"
            if ! want=$(crane digest "docker.io/$image"); then
              echo "::error::$image: no digest from Docker Hub"
              failed=1
              continue
            fi
            have=$(crane digest "$dst" 2>/dev/null || true)
            if [ "$want" = "$have" ]; then
              what=unchanged
            # A new package's first push can be DENIED for one of its
            # platforms' manifests (crane pushes them side by side while
            # GHCR creates the package): again, once it exists.
            elif crane copy "docker.io/$image" "$dst" || { sleep 10; crane copy "docker.io/$image" "$dst"; }; then
              what=copied
            else
              echo "::error::$image: couldn't copy it to $dst"
              failed=1
              continue
            fi
            echo "$image -> $dst $want ($what)"
            echo "| \`$image\` | \`$dst\` | \`$want\` | $what |" >> "$GITHUB_STEP_SUMMARY"
          done < .github/ci-images.txt
          exit "$failed"
      # Pulls need no credentials: a package that isn't public fails here,
      # and CI would fail on it the same way (docs/testing.md, "CI's images").
      - name: Public
        run: |
          set -uo pipefail
          failed=0
          while read -r image; do
            case "$image" in ''|'#'*) continue ;; esac
            repo=${image%%:*}
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:arugula-salad/ci/$repo:pull" | jq -r .token)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/arugula-salad/ci/$repo/manifests/${image#*:}")
            if [ "$code" != 200 ]; then
              echo "::error::$MIRROR/$image isn't public (an anonymous pull got $code): make the package public in the org's package settings"
              failed=1
            fi
          done < .github/ci-images.txt
          exit "$failed"
