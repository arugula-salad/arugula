# The quick checks: check.yml's lint on main's pushes, and binaries.yml's
# quick on pull requests, so they first fail on the pull request instead
# of on main after the merge (they broke main 4 times in 3 days, 2026-10-24
# to 27). On GitHub's runners, with just on PATH; gitleaks is the callers'
# (they scan different ranges). `just rollup-check` runs these steps too:
# a step added here goes into its list.
name: lint
description: shellcheck, rustfmt and the generated files' and release scripts' checks
runs:
  using: composite
  steps:
    - name: shellcheck
      # The version geek has: the runner image's changes what it reports.
      shell: bash
      run: |
        curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C /tmp
        sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
        shellcheck --version
    - name: Formatting
      # rust-toolchain.toml's toolchain, rustfmt only.
      shell: bash
      run: rustup component add rustfmt && just fmt-check
    - name: The shell scripts (install.sh, the release's, the CI's and the test stack's)
      shell: bash
      run: just shellcheck
    - name: Release scripts and ratchets
      shell: bash
      run: just test-scripts
    - name: The web client's wire types are current (web/src/proto.gen.ts)
      shell: bash
      run: just proto-ts check
    - name: The contract's JSON Schema is current (contract/schema/)
      shell: bash
      run: just contract-schema check
    - name: DECISIONS.md lists the decision records (docs/decisions/)
      shell: bash
      run: just decisions check
    - name: The release notes' headline sections (docs/releases/, What's new)
      shell: bash
      run: just whats-new
