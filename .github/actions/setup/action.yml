# What geek's disk used to give check.yml's jobs, for a fresh Linux runner
# (the home cloud's arugula-amd64 pods, docs/development.md): the toolchain,
# caches in place of the kept build directories, and the run's binaries from
# the jobs that built them in place of the shared run directory.
name: setup
description: Toolchain, caches and this run's binaries for a check.yml job on an ephemeral Linux runner
inputs:
  rust:
    description: The Rust toolchain and a build cache (false for jobs that only run built binaries)
    default: "true"
  cache-key:
    description: The build cache's key; jobs that build different things keep different caches
    default: ""
  ghostty-key:
    description: Ghostty's cache's key, when jobs share one (they build Ghostty for the same targets); the cache-key otherwise
    default: ""
  fetch:
    description: This run's binaries to fetch into $CI_RUN (scripts/ci-env), by artifact - any of run-debug, run-static
    default: ""
  packages:
    description: More apt packages
    default: ""
  claude-code:
    description: The Claude Code CLI, which the specs that set it up (journey-j5) find on PATH, as they did on geek
    default: "false"
runs:
  using: composite
  steps:
    - name: Where things go
      shell: bash
      run: |
        # On the job's own volume (_work), which the Docker sidecar shares:
        # the test stack mounts the binaries, and ci-env hard-links into it.
        echo "CI_RUNS=$RUNNER_TEMP/runs" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    # geek had these: vi and nvim for the layout spec; myhostname resolves *.localhost (browser-ports' sites) for Node,
    # as systemd's resolver did there; zstd for the caches.
    # The runner image may have them all (home-cloud's gha-runner, target
    # arugula: #868): then no apt at all.
    - name: Packages
      shell: bash
      run: |
        missing=()
        for p in vim-tiny neovim libnss-myhostname zstd ${{ inputs.packages }}; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || missing+=("$p")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${missing[@]}" >/dev/null
        fi
    - name: Rust (rust-toolchain.toml's)
      if: inputs.rust == 'true'
      shell: bash
      run: |
        command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
        "$HOME/.cargo/bin/rustup" toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt,clippy
    # Compiles through sccache (#868), whose cache is shared by every job and
    # run: home-cloud's ci-cache, rclone's WebDAV at a public name (the pods
    # reach nothing inside the cluster). rust-cache keeps only external
    # dependencies; this is what spares the workspace's own crates. Only
    # when the workflow passes the password (check.yml's env), so other
    # callers and forks compile as before.
    - name: sccache
      if: inputs.rust == 'true' && env.SCCACHE_WEBDAV_PASSWORD != ''
      uses: taiki-e/install-action@v2
      with:
        tool: sccache@0.18.0
    - name: Compile through sccache
      if: inputs.rust == 'true' && env.SCCACHE_WEBDAV_PASSWORD != ''
      shell: bash
      run: |
        # sccache won't start when its store doesn't answer (it reads one at
        # startup, and SCCACHE_IGNORE_SERVER_IO_ERROR doesn't cover that), so
        # every build would fail: if ci-cache is down, compile without it.
        if ! curl -fsS -o /dev/null --max-time 10 -X PROPFIND -H 'Depth: 0' \
            -u "arugula-ci:$SCCACHE_WEBDAV_PASSWORD" https://ci-cache.inevitable.fyi/; then
          echo "::warning::ci-cache didn't answer: compiling without sccache"
          exit 0
        fi
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_WEBDAV_ENDPOINT=https://ci-cache.inevitable.fyi"
          echo "SCCACHE_WEBDAV_USERNAME=arugula-ci"
          echo "SCCACHE_WEBDAV_KEY_PREFIX=arugula"
          # sccache can't cache incremental builds.
          echo "CARGO_INCREMENTAL=0"
          # If the server goes away mid-build, compile without it.
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
    - name: mise (Zig for libghostty, nextest)
      shell: bash
      run: |
        command -v mise >/dev/null || curl -fsSL https://mise.run | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    # mise's Zig and nextest: Zig's community mirror answered 429 once and
    # failed a job (#524).
    - uses: actions/cache@v4
      with:
        path: ~/.local/share/mise/installs
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    # What the runner image has already (home-cloud's gha-runner, target
    # arugula: #868), so the steps after don't fetch it again.
    - name: What the image has
      id: have
      shell: bash
      run: |
        case "$(node --version 2>/dev/null)" in v24.*) echo node=true ;; *) echo node=false ;; esac >> "$GITHUB_OUTPUT"
        case "$(pnpm --version 2>/dev/null)" in 12.*) echo pnpm=true ;; *) echo pnpm=false ;; esac >> "$GITHUB_OUTPUT"
        if compgen -G "$HOME/.cache/ms-playwright/chromium-*" >/dev/null; then echo browsers=true; else echo browsers=false; fi >> "$GITHUB_OUTPUT"
    # geek's: MISE_NODE_VERSION=24 and pnpm 12.
    - uses: actions/setup-node@v4
      if: steps.have.outputs.node != 'true'
      with:
        node-version: 24
    - uses: pnpm/action-setup@v4
      if: steps.have.outputs.pnpm != 'true'
      with:
        version: 12
    - name: Claude Code
      if: inputs.claude-code == 'true'
      shell: bash
      # Under ~/.local (on PATH since the mise step), not npm's global
      # prefix: the runner image's Node is root's /usr/local (#868), and
      # npm -g there fails with EACCES.
      run: npm install -g --silent --prefix "$HOME/.local" @anthropic-ai/claude-code@2.1.296
    - name: pnpm's store
      id: pnpm
      shell: bash
      run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    # Playwright's browsers (`just browsers` installs their system packages
    # each time; the downloads are what this keeps), unless the image has
    # them: `just browsers` fetches only a revision it lacks.
    - uses: actions/cache@v4
      if: steps.have.outputs.browsers != 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-
    # Ghostty's patched checkout and Zig's caches (vendor/libghostty-vt-sys,
    # #868): without them every Rust job clones and compiles Ghostty, ~3
    # CPU-minutes and a minute and a half of wall time each. A key per set
    # of targets (ghostty-key where jobs share one, else the job's own), and
    # no restore-keys, so a new Ghostty starts clean rather than growing the
    # old one.
    - name: Ghostty's cache
      if: inputs.rust == 'true'
      shell: bash
      run: echo "LIBGHOSTTY_VT_SYS_CACHE_DIR=$HOME/.cache/libghostty-vt-sys" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: inputs.rust == 'true'
      with:
        path: ~/.cache/libghostty-vt-sys
        key: ghostty-${{ runner.os }}-${{ inputs.ghostty-key || inputs.cache-key }}-${{ hashFiles('vendor/libghostty-vt-sys/**', '.mise.toml') }}
    # In place of the build directories geek kept (scripts/ci-cap-target).
    # Saved from main only, so branches don't evict main's.
    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ". -> target"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: This run's debug binaries and web client
      if: contains(inputs.fetch, 'run-debug')
      uses: actions/download-artifact@v4
      with:
        name: run-debug
        path: ${{ runner.temp }}/artifacts
    - name: This run's static binaries
      if: contains(inputs.fetch, 'run-static')
      uses: actions/download-artifact@v4
      with:
        name: run-static
        path: ${{ runner.temp }}/artifacts
    - name: Into the run directory (scripts/ci-env's $CI_RUN)
      if: inputs.fetch != ''
      shell: bash
      run: |
        run=$CI_RUNS/$GITHUB_RUN_ID
        mkdir -p "$run"
        for t in "$RUNNER_TEMP"/artifacts/*.tar; do tar -xf "$t" -C "$run"; done
