# The stack's bare repositories over HTTPS, read with basic auth: the user
# and password up.sh made (testnet/.state/git_https_password), as a forge
# takes a token. Clones only: nothing pushes over here.
server {
    listen 443 ssl;
    server_name git;
    ssl_certificate /etc/nginx/git-https.crt;
    ssl_certificate_key /etc/nginx/git-https.key;
    location / {
        auth_basic "git";
        auth_basic_user_file /etc/nginx/git-htpasswd;
        if ($arg_service = git-receive-pack) { return 403; }
        if ($uri ~ /git-receive-pack$) { return 403; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }
}
