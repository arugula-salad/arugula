# The local test stack (#200). One profile per scenario; `just testnet up
# <profile>` brings one up. Everything is named arugula-testnet-*, so
# `just testnet down` removes it and nothing else. See testnet/README.md.
# COMPOSE_PROJECT_NAME replaces the arugula-testnet prefix, so two stacks
# can run side by side; the scripts give each its own state directory.
name: arugula-testnet

networks:
  # The outer network: the bastion.
  outer:
    name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}
  # Only ssh gets through: no route out, and nothing published to the host.
  # The bastion is on both networks. Its subnet is fixed
  # (ARUGULA_TESTNET_INNER_NET, the first three octets).
  inner:
    name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-inner
    internal: true
    ipam:
      config:
        - subnet: ${ARUGULA_TESTNET_INNER_NET:-10.229.80}.0/24

# Ready, not just started: a service with a healthcheck is up when its
# check passes, so `up --wait` (up.sh, the tests' recreate) returns when a
# box answers ssh, not when its container is running. Without one, --wait
# took "running" for ready: box-systemd's systemd was still booting (no
# sshd yet) when the first login came. Probed every second until the first pass (up to
# start_period), then every minute.
x-ready: &ready
  start_period: 5m
  start_interval: 1s
  interval: 1m
  timeout: 10s
  retries: 3

# sshd answers with its banner: it's listening, with its host key.
x-sshd-ready: &sshd-ready
  <<: *ready
  test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/22 && read -r -t 5 l <&3 && [[ $$l == SSH-* ]]']

# The images' base, Docker Hub's debian from CI's mirror: ARUGULA_IMAGES
# (docs/testing.md, "CI's images"), as the services' images below.
x-images: &images
  ARUGULA_IMAGES: ${ARUGULA_IMAGES:-ghcr.io/arugula-salad/ci}

x-sshd: &sshd
  build: { context: ./sshd, args: *images }
  image: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-sshd
  volumes:
    - ${ARUGULA_TESTNET_STATE:-./.state}:/keys:ro
  healthcheck: *sshd-ready

services:
  bastion:
    <<: *sshd
    profiles: [ssh]
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-bastion
    hostname: bastion
    environment: { TESTNET_NAME: bastion }
    ports:
      - "127.0.0.1:${ARUGULA_TESTNET_SSH_PORT:-22922}:22"
    networks: [outer, inner]

  box-bare:
    <<: *sshd
    profiles: [ssh]
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-box-bare
    hostname: box-bare
    environment: { TESTNET_NAME: box-bare }
    networks: [inner]

  # systemd as PID 1 (logind, polkit), for linger without sudo. Needs a
  # privileged container with its own cgroup namespace.
  box-systemd:
    profiles: [ssh]
    build: { context: ./sshd-systemd, args: *images }
    image: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-sshd-systemd
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-box-systemd
    hostname: box-systemd
    privileged: true
    cgroup: private
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}:/keys:ro
    # Booted (every start job done: logind, which linger needs, and ssh),
    # and sshd answering.
    healthcheck:
      <<: *ready
      test:
        - CMD
        - bash
        - -c
        - >-
          case $$(systemctl is-system-running) in running|degraded) ;; *) exit 1 ;; esac &&
          exec 3<>/dev/tcp/127.0.0.1/22 && read -r -t 5 l <&3 && [[ $$l == SSH-* ]]
    networks: [inner]

  # A git server (bare repositories over ssh) for M51's `git push` from a
  # pane with the agent forwarded through `arugula --ssh`. git@git:repo.git.
  git:
    profiles: [ssh]
    build: { context: ./git, args: *images }
    image: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-git
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-git
    hostname: git
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}:/keys:ro
    # sshd starts last, after nginx (entrypoint.sh).
    healthcheck: *sshd-ready
    networks: [inner]

  # S28's tailnet comparison: headscale and two Tailscale nodes on the inner
  # network. ts-box is a box (userspace tailscaled, sshd); ts-client is
  # where the CLI runs, over ssh or over the tailnet, to the same daemon.
  headscale:
    profiles: [tailnet]
    image: headscale/headscale:0.29.4
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-headscale
    hostname: headscale
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
    networks: [inner]

  ts-box:
    profiles: [tailnet]
    build: { context: ./tailnet, args: *images }
    image: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-tailnet
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-ts-box
    hostname: ts-box
    environment: { TESTNET_NAME: ts-box, TS_TUN: userspace-networking }
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}:/keys:ro
    networks: [inner]

  ts-client:
    profiles: [tailnet]
    build: { context: ./tailnet, args: *images }
    image: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-tailnet
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-ts-client
    hostname: ts-client
    environment: { TESTNET_NAME: ts-client, TS_TUN: tailscale0 }
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}:/keys:ro
    networks: [inner]
