# testnet/window.sh's additions to compose.yaml (M141's rehearsal): the
# `control` profile with the platform beside it, as production has them
# the day of the window. Only window.sh uses it
# (`docker compose -f compose.yaml -f window.yaml`).
#
# - Control and the platform keep their databases in the state directory
#   (bind mounts, so `down`'s `rm -rf` of it removes them), running as the
#   host's user so it can: the window recreates both containers (a flip is
#   an environment change, like a Fly secret), and their files must
#   outlive that. The commands are compose.yaml's, with `--db` moved; keep
#   them in step.
# - Cloud is on in both, with a fake Managoat (`fakes-serve.ts --managoat`)
#   and the stack's own cloud secret key, the same in both, as the
#   platform's comes from Infisical and the hub's from Fly. Control takes
#   plain http to Managoat only on loopback, so each has a sidecar in its
#   network namespace forwarding 127.0.0.1:9004 to the one fake (window.sh
#   recreates it with its service). Managoat's client wants the system's
#   CA certificates, which debian-slim lacks (distroless has them): the
#   host's are mounted.
# - The platform is held (ARUGULA_PLATFORM_PAUSED) while
#   ARUGULA_TESTNET_PLATFORM_PAUSED is 1.
x-managoat: &managoat
  image: node:22-slim
  command:
    - node
    - -e
    - >-
      const net = require("net");
      net.createServer((c) => { const u = net.connect(9004, "fakes"); c.pipe(u).pipe(c);
        u.on("error", () => c.destroy()); c.on("error", () => u.destroy()); }).listen(9004, "127.0.0.1")

x-cloud: &cloud
  ARUGULA_MANAGOAT_URL: http://127.0.0.1:9004
  ARUGULA_MANAGOAT_API_KEY: mg_testnet
  ARUGULA_CLOUD_SECRET_KEY: c10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10dc10d
  ARUGULA_CLOUD_ACCOUNTS: "*"
  ARUGULA_CLOUD_MODEL: anthropic/test

services:
  control:
    user: "${ARUGULA_TESTNET_UID:?window.sh sets it}:${ARUGULA_TESTNET_GID:?window.sh sets it}"
    command:
      - /opt/arugula/arugula-control
      - --listen=0.0.0.0:8080
      - --public-url=http://${ARUGULA_TESTNET_INNER_NET:-10.229.80}.10:8080
      - --db=/window/control.db
      - --github-client-id=id
      - --github-client-secret=secret
      - --github-url=http://fakes:9001
      - --github-api=http://fakes:9001
      - --stripe-api=http://fakes:9002
      - --stripe-seat-price=price_seat
      - --stripe-minutes-price=price_min
      - --push-host=fakes:9003
      - --guest-ssh=0.0.0.0:2222
      - --guest-ssh-host=127.0.0.1:${ARUGULA_TESTNET_GUEST_SSH_PORT:-22982}
    environment:
      <<: *cloud
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}/window/hub:/window
      - /etc/ssl/certs:/etc/ssl/certs:ro

  platform:
    user: "${ARUGULA_TESTNET_UID:?window.sh sets it}:${ARUGULA_TESTNET_GID:?window.sh sets it}"
    command:
      - /opt/arugula/arugula-platform
      - --listen=0.0.0.0:7700
      - --db=/window/platform.db
      - --hub=http://control:7691
      - --public-url=http://${ARUGULA_TESTNET_INNER_NET:-10.229.80}.10:8080
      - --stripe-api=http://fakes:9002
      - --stripe-seat-price=price_seat
      - --stripe-minutes-price=price_min
    environment:
      <<: *cloud
      ARUGULA_PLATFORM_PAUSED: ${ARUGULA_TESTNET_PLATFORM_PAUSED:-0}
    volumes:
      - ${ARUGULA_TESTNET_STATE:-./.state}/window/platform:/window
      - /etc/ssl/certs:/etc/ssl/certs:ro

  fakes:
    command: [node, --experimental-strip-types, --no-warnings, /fixtures/fakes-serve.ts, --managoat]

  managoat-hub:
    <<: *managoat
    profiles: [control]
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-managoat-hub
    network_mode: service:control

  managoat-platform:
    <<: *managoat
    profiles: [platform]
    container_name: ${COMPOSE_PROJECT_NAME:-arugula-testnet}-managoat-platform
    network_mode: service:platform
