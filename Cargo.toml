[workspace]
resolver = "3"
members = ["crates/*"]
# The hosted server (control, its platform and what they share) is a
# workspace of its own, server/Cargo.toml, so the daemon's builds never
# compile it and its builds never compile the daemon or Ghostty. The desktop
# app is one too (#388).
exclude = [
    "vendor/libghostty-vt-sys",
    "crates/desktop",
    "crates/arugula-control",
    "crates/arugula-platform",
    "crates/control",
    "crates/control-common",
    "crates/platform",
    "crates/platform-agents",
    "crates/platform-all",
]

# libghostty-vt-sys with Ghostty patched at build time (M9): see
# vendor/libghostty-vt-sys/patches.
[patch."https://github.com/Uzaaft/libghostty-rs.git"]
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[workspace.package]
version = "0.65.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arugula-salad/arugula"

[workspace.dependencies]
# The versions every crate shares; a crate adds its own features, `optional`
# and (for the Unix and Windows tables) its target with
# `dep = { workspace = true, ... }`.
arugula-control-wire = { path = "crates/control-wire" }
arugula-core = { path = "crates/core" }
arugula-e2e = { path = "crates/e2e" }
arugula-forge-github = { path = "crates/forge-github" }
arugula-mux = { path = "crates/mux" }
arugula-proto = { path = "crates/proto" }
arugula-vt = { path = "crates/vt" }
# The daemon's crates (#232). The binary, crates/arugulad, picks their
# features, so their defaults are off here.
arugulad-agent = { path = "crates/arugulad-agent", default-features = false }
arugulad-base = { path = "crates/daemon", default-features = false }
arugulad-control-tools = { path = "crates/arugulad-control-tools" }
arugulad-docs = { path = "crates/arugulad-docs" }
arugulad-drivers = { path = "crates/arugulad-drivers" }
arugulad-editor = { path = "crates/arugulad-editor" }
arugulad-forge = { path = "crates/arugulad-forge" }
arugulad-hosted = { path = "crates/arugulad-hosted" }
arugulad-invite = { path = "crates/arugulad-invite" }
arugulad-labs = { path = "crates/arugulad-labs" }
arugulad-mcp = { path = "crates/arugulad-mcp" }
arugulad-review = { path = "crates/arugulad-review" }
arugulad-work = { path = "crates/arugulad-work" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = "4.6.7"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
# The OS's random source on every system (not /dev/urandom, which Windows lacks).
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
nix = "0.31.3"
p256 = "0.14.0"
proptest = "1.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
russh = { version = "0.64.0", default-features = false }
rust-embed = "8.12.0"
rustls-platform-verifier = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Its warnings are for serde attributes it can't read (`from`, `other`):
# they change only how a type parses, not how it looks.
ts-rs = "12.0.1"
tungstenite = "0.30.0"
url = "2.5.8"
webpki-root-certs = "1.0.9"
windows-sys = "0.60"
zstd = "0.14.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds are 15-60 GB a worktree and every worktree has its own
# target/ (AGENTS.md). Line tables keep backtraces' file:line for our crates
# without the variable and type info a debugger reads; dependencies get no
# debug info. A fresh `cargo build --workspace --all-targets` goes from 11 GB
# to 5.9 GB. The package override wins over CARGO_PROFILE_DEV_DEBUG, so
# for a debugger session with full info everywhere:
#   cargo build --config 'profile.dev.debug="full"' \
#     --config 'profile.dev.package."*".debug="full"'
# (CARGO_PROFILE_DEV_DEBUG=full alone gives our crates full info, not deps.)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
