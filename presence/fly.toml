# arugula.stream: the presence relay serving the demo (#315). `fly deploy`
# from presence/ (the image builds presence/demo into the relay). Secrets:
# SECRET_KEY_BASE, DEMO_SECRET, and PRESENCE_APPS once a host app uses it.
# One machine: rooms live in one node's memory until the relay clusters.
app = "arugula-stream"
primary_region = "ewr"

[build]
  dockerfile = "relay/Dockerfile"

[env]
  PHX_HOST = "arugula.stream"
  PORT = "4000"
  METRICS_PORT = "9091"
  DEMO = "1"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# /metrics (#318's P12) on the internal port 9091, which no service
# exposes: Fly scrapes it into its managed Grafana (fly-metrics.net), with
# the app, instance and region as labels. presence/ops/README.md has the
# dashboard and the alerts.
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
